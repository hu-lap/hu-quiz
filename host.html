<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HU Quiz - 강사 화면</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f4f6f9;
      text-align: center;
    }

    .container {
      min-height: 100vh;
      padding: 50px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 50px;
    }

    .question {
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 50px;
    }

    .total {
      font-size: 30px;
      margin-bottom: 40px;
    }

    .results {
      display: flex;
      justify-content: center;
      gap: 30px;
    }

    .result {
      width: 300px;
      padding: 40px;
      border-radius: 20px;
      color: white;
    }

    .result1 {
      background: #e74c3c;
    }

    .result2 {
      background: #3498db;
    }

    .label {
      font-size: 30px;
      font-weight: bold;
    }

    .count {
      font-size: 70px;
      font-weight: bold;
      margin-top: 20px;
    }

    .control {
      margin-top: 50px;
    }

    button {
      padding: 18px 35px;
      margin: 10px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>HU Quiz · 강사 화면</h1>

    <div class="question">
      탕수육을 먹을 때 당신의 선택은?
    </div>

    <div class="total">
      응답 <strong><span id="totalCount">0</span>명</strong>
    </div>

    <div class="results">

      <div class="result result1">
        <div class="label">① 부먹</div>
        <div class="count" id="pourCount">0</div>
      </div>

      <div class="result result2">
        <div class="label">② 찍먹</div>
        <div class="count" id="dipCount">0</div>
      </div>

    </div>

    <div class="control">
      <button>정답 공개</button>
      <button>다음 문제</button>
    </div>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";


    const firebaseConfig = {
      apiKey: "AIzaSyAYszYNkItL6kfrpJ5An7Z_AgDVY4nmUbg",
      authDomain: "hu-quiz.firebaseapp.com",
      databaseURL: "https://hu-quiz-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "hu-quiz",
      storageBucket: "hu-quiz.firebasestorage.app",
      messagingSenderId: "344334242719",
      appId: "1:344334242719:web:b87436d3cba0fafd6ca3aa"
    };


    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const answersRef = ref(database, "answers");


    onValue(answersRef, function(snapshot) {

      let total = 0;
      let pour = 0;
      let dip = 0;

      snapshot.forEach(function(childSnapshot) {

        const data = childSnapshot.val();

        total++;

        if (data.answer === "부먹") {
          pour++;
        }

        if (data.answer === "찍먹") {
          dip++;
        }

      });


      document.getElementById("totalCount").textContent = total;
      document.getElementById("pourCount").textContent = pour;
      document.getElementById("dipCount").textContent = dip;

    });

  </script>

</body>
</html>
