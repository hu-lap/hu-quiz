<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HU Quiz - 강사 화면</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f4f6f9;
      text-align: center;
    }

    .container {
      min-height: 100vh;
      padding: 45px;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 35px;
    }

    .status {
      display: inline-block;
      padding: 10px 22px;
      margin-bottom: 30px;
      border-radius: 30px;
      background: #ddd;
      font-size: 18px;
      font-weight: bold;
    }

    .question {
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 35px;
    }

    .total {
      font-size: 30px;
      margin-bottom: 35px;
    }

    .results {
      display: flex;
      justify-content: center;
      gap: 30px;
    }

    .result {
      width: 300px;
      padding: 40px;
      border-radius: 20px;
      color: white;
    }

    .result1 { background: #e74c3c; }
    .result2 { background: #3498db; }

    .label {
      font-size: 30px;
      font-weight: bold;
    }

    .count {
      font-size: 70px;
      font-weight: bold;
      margin-top: 20px;
    }

    .controls {
      margin-top: 45px;
    }

    button {
      padding: 18px 30px;
      margin: 8px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    .start-button {
      background: #222;
      color: white;
    }

    .secondary-button {
      background: white;
      border: 1px solid #ddd;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>HU Quiz · 강사 화면</h1>

    <div id="status" class="status">
      대기 중
    </div>

    <div class="question">
      탕수육을 먹을 때 당신의 선택은?
    </div>

    <div class="total">
      응답 <strong><span id="totalCount">0</span>명</strong>
    </div>

    <div class="results">

      <div class="result result1">
        <div class="label">① 부먹</div>
        <div class="count" id="pourCount">0</div>
      </div>

      <div class="result result2">
        <div class="label">② 찍먹</div>
        <div class="count" id="dipCount">0</div>
      </div>

    </div>

    <div class="controls">

      <button
        class="start-button"
        onclick="startQuestion()"
      >
        1번 문제 시작
      </button>

      <button class="secondary-button">
        정답 공개
      </button>

      <button class="secondary-button">
        다음 문제
      </button>

    </div>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      set,
      onValue
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";


    const firebaseConfig = {
      apiKey: "AIzaSyAYszYNkItL6kfrpJ5An7Z_AgDVY4nmUbg",
      authDomain: "hu-quiz.firebaseapp.com",
      databaseURL: "https://hu-quiz-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "hu-quiz",
      storageBucket: "hu-quiz.firebasestorage.app",
      messagingSenderId: "344334242719",
      appId: "1:344334242719:web:b87436d3cba0fafd6ca3aa"
    };


    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);


    // ----------------------------------
    // 1번 문제 시작
    // ----------------------------------

    window.startQuestion = async function () {

      try {

        await set(ref(database, "quizState"), {
          status: "question",
          question: 1,
          startedAt: Date.now()
        });

        document.getElementById("status").textContent =
          "1번 문제 진행 중";

      } catch (error) {

        alert("문제 시작에 실패했습니다.");
        console.error(error);

      }

    };


    // ----------------------------------
    // 현재 진행 상태 실시간 확인
    // ----------------------------------

    const stateRef = ref(database, "quizState");

    onValue(stateRef, function(snapshot) {

      const state = snapshot.val();

      if (!state) {
        document.getElementById("status").textContent =
          "대기 중";
        return;
      }

      if (state.status === "question") {
        document.getElementById("status").textContent =
          state.question + "번 문제 진행 중";
      }

      if (state.status === "waiting") {
        document.getElementById("status").textContent =
          "대기 중";
      }

    });


    // ----------------------------------
    // 교육생 답변 실시간 집계
    // ----------------------------------

    const answersRef = ref(database, "answers");

    onValue(answersRef, function(snapshot) {

      let total = 0;
      let pour = 0;
      let dip = 0;

      snapshot.forEach(function(childSnapshot) {

        const data = childSnapshot.val();

        // 앞으로 여러 문제가 생기므로
        // 1번 문제 답변만 집계
        if (data.question !== 1) {
          return;
        }

        total++;

        if (data.answer === "부먹") {
          pour++;
        }

        if (data.answer === "찍먹") {
          dip++;
        }

      });

      document.getElementById("totalCount").textContent = total;
      document.getElementById("pourCount").textContent = pour;
      document.getElementById("dipCount").textContent = dip;

    });

  </script>

</body>
</html>
