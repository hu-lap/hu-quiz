<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HU Quiz - 강사 화면</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Noto Sans KR", sans-serif;
  background: #f4f6f9;
  color: #222;
}

.container {
  min-height: 100vh;
  padding: 35px 5%;
  text-align: center;
}

/* ==============================
   상단 영역
============================== */

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
  position: relative;
}

.logo {
  font-size: 24px;
  font-weight: bold;
}

.top-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.status {
  background: #e8e8e8;
  padding: 10px 20px;
  border-radius: 30px;
  font-weight: bold;
}

/* 관리 버튼 - 정상 진행 버튼과 시각적으로 분리 */
.manage-button {
  margin: 0;
  padding: 8px 12px;
  font-size: 14px;
  font-weight: normal;
  background: transparent;
  color: #777;
  border: 1px solid #ccc;
  border-radius: 8px;
  cursor: pointer;
}

/* 관리 패널 */
.management-panel {
  display: none;
  position: absolute;
  right: 0;
  top: 52px;
  width: 290px;
  padding: 18px;
  background: white;
  border: 1px solid #ccc;
  border-radius: 12px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.15);
  z-index: 1000;
  text-align: left;
}

.management-title {
  font-size: 17px;
  font-weight: bold;
  margin-bottom: 12px;
}

.management-note {
  margin-top: 10px;
  font-size: 13px;
  line-height: 1.5;
  color: #777;
}

/* 초기화는 관리 패널 안에만 존재 */
.reset-button {
  width: 100%;
  margin: 0;
  padding: 12px;
  font-size: 15px;
  font-weight: bold;
  background: white;
  color: #444;
  border: 1px solid #bbb;
  border-radius: 8px;
  cursor: pointer;
}

.reset-button:disabled {
  background: #eee;
  color: #aaa;
  border-color: #ddd;
  cursor: not-allowed;
}

/* ==============================
   문제 영역
============================== */

.question-number {
  color: #777;
  font-size: 20px;
  margin-top: 20px;
}

.question {
  font-size: 40px;
  font-weight: bold;
  margin: 15px auto 30px;
  max-width: 1000px;
}

.response {
  font-size: 28px;
  margin: 25px 0;
}

.options {
  max-width: 900px;
  margin: 20px auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.option {
  background: white;
  border-radius: 15px;
  padding: 22px;
  font-size: 22px;
  font-weight: bold;
  border: 2px solid #e5e5e5;
}

/* ==============================
   정답/결과
============================== */

.result-area {
  display: none;
  max-width: 900px;
  margin: 25px auto;
}

.correct-answer {
  background: #eaf7ee;
  border: 2px solid #45a35b;
  padding: 20px;
  border-radius: 15px;
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 20px;
}

.explanation {
  background: white;
  padding: 20px;
  border-radius: 15px;
  font-size: 19px;
  margin-bottom: 25px;
}

.result-row {
  margin: 12px 0;
  text-align: left;
}

.result-label {
  margin-bottom: 6px;
  font-weight: bold;
}

.bar-bg {
  width: 100%;
  height: 32px;
  background: #ddd;
  border-radius: 8px;
  overflow: hidden;
}

.bar {
  height: 100%;
  background: #555;
  width: 0%;
  transition: width 0.4s;
}

/* ==============================
   순위
============================== */

.ranking {
  display: none;
  max-width: 650px;
  margin: 25px auto;
  background: white;
  border-radius: 18px;
  padding: 25px;
}

.ranking h2 {
  margin-top: 0;
}

.rank-item {
  padding: 12px;
  font-size: 21px;
  border-bottom: 1px solid #eee;
}

/* ==============================
   제한시간 / 문제 순위
============================== */

.timer-panel {
  max-width: 760px;
  margin: 18px auto 10px;
  padding: 16px 20px;
  background: white;
  border-radius: 14px;
}

.timer-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}

.timer-title {
  color: #666;
  font-size: 17px;
}

.timer-value {
  font-size: 36px;
  font-weight: bold;
}

.timer-bar-bg {
  width: 100%;
  height: 12px;
  margin-top: 10px;
  background: #ddd;
  border-radius: 999px;
  overflow: hidden;
}

.timer-bar {
  width: 100%;
  height: 100%;
  background: #222;
  transition: width 0.1s linear;
}

.question-meta {
  margin-top: 8px;
  color: #666;
  font-size: 17px;
}

.important-badge {
  display: inline-block;
  margin-left: 8px;
  padding: 5px 10px;
  border-radius: 999px;
  background: #fff1b8;
  color: #6b5200;
  font-weight: bold;
}

.rank-item.top3 {
  font-size: 26px;
  font-weight: bold;
  padding: 16px 12px;
}

.rank-item.lower {
  font-size: 19px;
  color: #555;
  padding: 9px 12px;
}

.rank-close {
  margin-top: 18px;
  padding: 11px 18px;
  font-size: 16px;
  background: #eee;
  border: 1px solid #ccc;
  border-radius: 9px;
  cursor: pointer;
}


/* ==============================
   정상 진행 조작부
============================== */

.controls {
  margin-top: 35px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 16px 26px;
  margin: 7px;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
}

.primary {
  background: #222;
  color: white;
}

.secondary {
  background: white;
  border: 1px solid #ccc;
}

#startButton {
  font-size: 23px;
  padding: 20px 40px;
}

/* ==============================
   종료 화면
============================== */

.finished-message {
  font-size: 46px;
  font-weight: bold;
  margin: 40px 0 20px;
}


/* 관리자 인증 전 강사 화면을 숨김 */
body:not(.admin-ready) .container { display:none; }
#authGate { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
body.admin-ready #authGate { display:none; }
.auth-card { width:100%; max-width:410px; background:white; border-radius:20px; padding:34px; text-align:center; box-shadow:0 8px 32px #0001; }
.auth-card input { width:100%; padding:15px; border:1px solid #bbb; border-radius:10px; font-size:19px; margin:16px 0; }
.auth-card button { width:100%; background:#222; color:white; }
#authError { color:#a32222; min-height:26px; font-size:14px; }
</style>
</head>

<body>
<div id="authGate"><div class="auth-card">
<h1>🔐 HU Quiz 관리자</h1>
<p>관리자 비밀번호를 입력하세요.</p>
<form id="authForm"><input id="adminPassword" type="password" autocomplete="current-password" required placeholder="관리자 비밀번호"><button id="authButton" type="submit">로그인</button></form>
<div id="authError" role="alert"></div>
</div></div>

<div class="container">

  <!-- ==========================
       상단
  =========================== -->

  <div class="top">

    <div class="logo">
      HU Quiz
    </div>

    <div class="top-right">

      <div id="status" class="status">
        대기 중
      </div>

      <button
        class="manage-button"
        onclick="toggleManagement()">
        ⚙ 관리
      </button>

    </div>

    <!-- 관리 기능은 정상 진행 버튼과 분리 -->
    <div
      id="managementPanel"
      class="management-panel">

      <div class="management-title">
        퀴즈 관리
      </div>
      <button id="logoutButton" class="reset-button" style="margin-bottom:12px" type="button">관리자 로그아웃</button>

      <button
        id="resetButton"
        class="reset-button"
        onclick="resetQuiz()">
        새 퀴즈 준비
      </button>

      <div
        id="resetNotice"
        class="management-note">
        이전 참가자와 답변을 초기화합니다.
      </div>

    </div>

  </div>


  <!-- ==========================
       참가자 대기 화면
  =========================== -->

  <div id="lobbyArea">

    <h2 style="font-size:32px; margin-top:40px;">
      교육생 입장을 기다리고 있습니다
    </h2>

    <div style="margin:25px auto 30px;">

      <div style="
        font-size:20px;
        margin-bottom:15px;
        color:#555;
      ">
        휴대폰으로 QR코드를 스캔하여 참여하세요
      </div>

      <img
        id="joinQR"
        alt="HU Quiz 참여 QR코드"
        style="
          width:220px;
          height:220px;
          background:white;
          padding:10px;
          border-radius:15px;
          border:1px solid #ddd;
        "
      >

      <div style="
        margin-top:12px;
        font-size:15px;
        color:#888;
      ">
        hu-lap.github.io/hu-quiz/
      </div>

    </div>

    <div style="font-size:28px; margin:30px 0;">
      현재
      <strong>
        <span id="participantCount">0</span>명
      </strong>
      입장
    </div>

    <div
      id="participantList"
      style="
        max-width:700px;
        margin:20px auto;
        font-size:20px;
        line-height:1.8;
      ">
    </div>

  </div>


  <!-- ==========================
       문제 화면
  =========================== -->

  <div
    id="questionArea"
    style="display:none;">

    <div
      id="questionNumber"
      class="question-number">
      퀴즈 시작 전
    </div>

    <div
      id="questionText"
      class="question">
      준비가 완료되면 퀴즈를 시작하세요.
    </div>

    <div id="questionMeta" class="question-meta"></div>

    <div id="timerPanel" class="timer-panel">
      <div class="timer-top">
        <div class="timer-title">남은 시간</div>
        <div id="timerValue" class="timer-value">--</div>
      </div>
      <div class="timer-bar-bg">
        <div id="timerBar" class="timer-bar"></div>
      </div>
    </div>

    <div
      id="options"
      class="options">
    </div>

    <div
      id="responseArea"
      class="response">
      응답
      <strong>
        <span id="responseCount">0</span>명
      </strong>
    </div>

  </div>


  <!-- ==========================
       정답 결과
  =========================== -->

  <div
    id="resultArea"
    class="result-area">

    <div
      id="correctAnswer"
      class="correct-answer">
    </div>

    <div
      id="explanation"
      class="explanation">
    </div>

    <div id="resultBars">
    </div>

  </div>


  <!-- ==========================
       순위
  =========================== -->

  <div
    id="ranking"
    class="ranking">

    <h2 id="rankingTitle">
      현재 순위
    </h2>

    <div id="rankingList">
    </div>

    <button
      id="rankCloseButton"
      class="rank-close"
      onclick="closeRanking()"
      style="display:none;">
      순위 닫기
    </button>

  </div>


  <!-- ==========================
       정상 진행 조작부
  =========================== -->

  <div class="controls">

    <button
      id="startButton"
      class="primary"
      onclick="startQuiz()">
      퀴즈 시작
    </button>

    <button
      id="answerButton"
      class="secondary"
      onclick="revealAnswer()"
      style="display:none;">
      정답 공개
    </button>

    <button
      id="rankButton"
      class="secondary"
      onclick="showRanking()"
      style="display:none;">
      이번 문제 순위 공개
    </button>

    <button
      id="nextButton"
      class="primary"
      onclick="nextQuestion()"
      style="display:none;">
      다음 문제
    </button>

  </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  get,
  onValue,
  remove,
  update,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";



/* ==============================
   Firebase 설정
============================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyAYszYNkItL6kfrpJ5An7Z_AgDVY4nmUbg",

  authDomain:
    "hu-quiz.firebaseapp.com",

  databaseURL:
    "https://hu-quiz-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "hu-quiz",

  storageBucket:
    "hu-quiz.firebasestorage.app",

  messagingSenderId:
    "344334242719",

  appId:
    "1:344334242719:web:b87436d3cba0fafd6ca3aa"

};


const app =
  initializeApp(firebaseConfig);

const database =
  getDatabase(app);
const auth = getAuth(app);
const ADMIN_EMAIL = "admin@hu-lab.com";
const ADMIN_UID = "sx4AGkO3lobofS46Oz5CiTw6xuA3";
let adminAuthenticated = false;

const authForm = document.getElementById("authForm");
authForm.addEventListener("submit", async event => {
  event.preventDefault();
  const button = document.getElementById("authButton");
  const error = document.getElementById("authError");
  button.disabled = true;
  error.textContent = "";
  try {
    const result = await signInWithEmailAndPassword(auth, ADMIN_EMAIL, document.getElementById("adminPassword").value);
    if (result.user.uid !== ADMIN_UID) {
      await signOut(auth);
      throw new Error("관리자 계정이 아닙니다.");
    }
    document.getElementById("adminPassword").value = "";
  } catch (e) {
    error.textContent = "로그인 실패: 비밀번호 또는 관리자 권한을 확인하세요.";
    console.error(e);
  } finally { button.disabled = false; }
});

onAuthStateChanged(auth, async user => {
  adminAuthenticated = Boolean(user && user.uid === ADMIN_UID);
  document.body.classList.toggle("admin-ready", adminAuthenticated);
  if (user && !adminAuthenticated) await signOut(auth);
});

document.getElementById("logoutButton").addEventListener("click", async () => {
  if (!adminAuthenticated) return;
  document.getElementById("managementPanel").style.display = "none";
  await signOut(auth);
});


/* ==============================
   샘플 문제
============================== */

const questions = [

  {
    type: "choice",
    text: "탕수육을 먹을 때 당신의 선택은?",
    options: ["부먹", "찍먹"],
    correct: "찍먹",
    explanation:
      "샘플 문제입니다. 정답은 찍먹으로 설정했습니다.",
    durationSec: 10,
    points: 1000
  },

  {
    type: "ox",
    text: "대한민국의 수도는 서울이다.",
    options: ["O", "X"],
    correct: "O",
    explanation:
      "대한민국의 수도는 서울입니다.",
    durationSec: 10,
    points: 1000
  },

  {
    type: "choice",
    text: "다음 중 우리나라의 수도는 어디일까요?",
    options: ["서울", "부산", "대전", "제주"],
    correct: "서울",
    explanation:
      "대한민국의 수도는 서울입니다.",
    durationSec: 20,
    points: 2000
  },

  {
    type: "order",
    text: "다음 숫자를 작은 수부터 순서대로 선택하세요.",
    options: ["3", "1", "4", "2"],
    correct: ["1", "2", "3", "4"],
    explanation:
      "작은 수부터 배열하면 1 → 2 → 3 → 4입니다.",
    durationSec: 20,
    points: 1000
  }

];


/* ==============================
   현재 상태

   waiting  : 대기
   question : 문제 진행
   result   : 정답 공개
   finished : 종료
============================== */

let quizMode = "waiting";

let currentQuestion = -1;

let currentAnswers = [];

let questionStartedAt = 0;

let timerInterval = null;

let serverTimeOffset = 0;

let questionScores = [];


/* ==============================
   Firebase 서버시간 / 타이머
============================== */

onValue(
  ref(database, ".info/serverTimeOffset"),
  snapshot => {
    serverTimeOffset = Number(snapshot.val()) || 0;
  }
);

function serverNow() {
  return Date.now() + serverTimeOffset;
}

function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

function startHostTimer(startedAt, durationSec) {

  stopTimer();

  questionStartedAt = Number(startedAt);

  const totalMs =
    Number(durationSec) * 1000;

  const updateTimer = () => {

    const remainingMs =
      Math.max(
        0,
        totalMs - (serverNow() - questionStartedAt)
      );

    document.getElementById("timerValue")
      .textContent =
      (remainingMs / 1000).toFixed(1) + "초";

    document.getElementById("timerBar")
      .style.width =
      Math.max(
        0,
        Math.min(100, remainingMs / totalMs * 100)
      ) + "%";

    if (remainingMs <= 0) {
      stopTimer();

      document.getElementById("status")
        .textContent = "응답시간 종료";
    }

  };

  updateTimer();

  timerInterval =
    setInterval(updateTimer, 100);

}


/* ==============================
   관리 메뉴
============================== */

window.toggleManagement = function() {
  if (!adminAuthenticated) { alert("관리자 로그인이 필요합니다."); return; }

  const panel =
    document.getElementById("managementPanel");

  if (panel.style.display === "block") {

    panel.style.display = "none";

  } else {

    panel.style.display = "block";

  }

};


/* ==============================
   관리기능 상태 변경

   진행 중에는 초기화 인터록
============================== */

function updateManagementState() {

  const resetButton =
    document.getElementById("resetButton");

  const resetNotice =
    document.getElementById("resetNotice");


  if (
    quizMode === "question" ||
    quizMode === "result"
  ) {

    resetButton.disabled = true;

    resetButton.textContent =
      "🔒 새 퀴즈 준비";

    resetNotice.textContent =
      "퀴즈 진행 중에는 초기화할 수 없습니다.";

  } else {

    resetButton.disabled = false;

    resetButton.textContent =
      "새 퀴즈 준비";

    resetNotice.textContent =
      "이전 참가자와 답변을 초기화합니다.";

  }

}


/* ==============================
   새 퀴즈 준비
============================== */

window.resetQuiz = async function() {
  if (!adminAuthenticated) { alert("관리자 로그인이 필요합니다."); return; }

  /*
    UI 비활성화 외에도
    함수 자체에서 다시 한번 차단.
    즉 이중 방어.
  */

  if (
    quizMode === "question" ||
    quizMode === "result"
  ) {

    alert(
      "퀴즈가 진행 중입니다.\n" +
      "진행 중에는 초기화할 수 없습니다."
    );

    return;

  }


  const participantCount =
    document.getElementById("participantCount")
      .textContent;


  const ok = confirm(
    "새 퀴즈를 준비하시겠습니까?\n\n" +
    "현재 참가자 " +
    participantCount +
    "명과 기존 답변이 모두 삭제됩니다.\n\n" +
    "이 작업은 되돌릴 수 없습니다."
  );


  if (!ok) {
    return;
  }


  try {

    await remove(
      ref(database, "participants")
    );

    await remove(
      ref(database, "answers")
    );

    await remove(
      ref(database, "questionScores")
    );

    stopTimer();


    await set(
      ref(database, "quizState"),
      {
        status: "waiting",
        resetAt: Date.now()
      }
    );


    quizMode = "waiting";

    currentQuestion = -1;

    currentAnswers = [];


    document.getElementById("status")
      .textContent =
      "대기 중";


    document.getElementById("responseCount")
      .textContent =
      "0";


    document.getElementById("lobbyArea")
      .style.display =
      "block";


    document.getElementById("questionArea")
      .style.display =
      "none";

    document.getElementById("timerPanel")
      .style.display =
      "block";

    document.getElementById("questionMeta")
      .style.display =
      "block";


    document.getElementById("resultArea")
      .style.display =
      "none";


    document.getElementById("ranking")
      .style.display =
      "none";


    document.getElementById("startButton")
      .style.display =
      "inline-block";


    document.getElementById("answerButton")
      .style.display =
      "none";


    document.getElementById("rankButton")
      .style.display =
      "none";


    document.getElementById("nextButton")
      .style.display =
      "none";


    document.getElementById("managementPanel")
      .style.display =
      "none";


    updateManagementState();

/* ==============================
   정답 공개
============================== */

window.revealAnswer = async function() {
  if (!adminAuthenticated) { alert("관리자 로그인이 필요합니다."); return; }

  if (quizMode !== "question") {
    return;
  }

  const q =
    questions[currentQuestion];

  stopTimer();

  /*
    점수 계산 기준:
    - 오답 0점
    - 정답만 점수 부여
    - 문제 시작부터 제한시간까지 선형 감소
    - 일반문제 최고 1000점
    - 중요문제 최고 2000점
  */

  const totalMs =
    Number(q.durationSec) * 1000;

  const correctAnswers =
    currentAnswers
       .filter(data => {
        if (Number(data.question) !== currentQuestion) return false;
        const submittedAt = Number(data.submittedAt);
        if (!Number.isFinite(submittedAt) || submittedAt < questionStartedAt ||
            submittedAt > questionStartedAt + Number(q.durationSec) * 1000) return false;
        return q.type === "order"
          ? JSON.stringify(data.answer) === JSON.stringify(q.correct)
          : data.answer === q.correct;
      })
      .map(data => {

        const submittedAt =
          Number(data.submittedAt);

        const elapsedMs =
          Math.max(
            0,
            submittedAt - questionStartedAt
          );

        const remainingRatio =
          Math.max(
            0,
            Math.min(
              1,
              (totalMs - elapsedMs) / totalMs
            )
          );

        const score =
          Math.round(
            Number(q.points) * remainingRatio
          );

        return {
          participantId:
            data.participantId || data.nickname,
          nickname:
            data.nickname,
          submittedAt:
            submittedAt,
          elapsedMs:
            elapsedMs,
          score:
            score
        };

      })
      .sort((a,b) => {

        if (b.score !== a.score) {
          return b.score - a.score;
        }

        return a.submittedAt - b.submittedAt;

      });


  const scoreObject = {};

  correctAnswers.forEach(item => {

    const key =
      String(item.participantId);

    scoreObject[key] = {
      participantId:
        item.participantId,
      nickname:
        item.nickname,
      question:
        currentQuestion,
      score:
        item.score,
      submittedAt:
        item.submittedAt,
      elapsedMs:
        item.elapsedMs
    };

  });


  await set(
    ref(
      database,
      "questionScores/" + currentQuestion
    ),
    scoreObject
  );


  questionScores =
    correctAnswers;


  quizMode =
    "result";


  await set(
    ref(database, "quizState"),
    {
      status: "result",
      question: currentQuestion,
      revealed: true,
      durationSec: q.durationSec,
      points: q.points,
      startedAt: questionStartedAt
    }
  );


  showResults(q);


  document.getElementById("status")
    .textContent =
    "정답 공개";


  document.getElementById("answerButton")
    .style.display =
    "none";


  document.getElementById("rankButton")
    .style.display =
    "inline-block";


  document.getElementById("nextButton")
    .style.display =
    "inline-block";


  updateManagementState();

};


/* ==============================
   결과 표시
============================== */

function showResults(q) {

  document.getElementById("resultArea")
    .style.display =
    "block";


  let correctText;


  if (q.type === "order") {

    correctText =
      q.correct.join(" → ");

  } else {

    correctText =
      q.correct;

  }


  document.getElementById("correctAnswer")
    .textContent =
    "정답 : " +
    correctText;


  document.getElementById("explanation")
    .textContent =
    q.explanation;


  const resultBars =
    document.getElementById("resultBars");


  resultBars.innerHTML = "";


  /*
    순서 선택 문제는
    단일 보기별 분포가 의미가 없으므로
    제출한 순서 조합별로 집계
  */

  if (q.type === "order") {

    const orderCounts = {};


    currentAnswers.forEach(data => {

      let answerText;


      if (Array.isArray(data.answer)) {

        answerText =
          data.answer.join(" → ");

      } else {

        answerText =
          String(data.answer)
            .split(",")
            .join(" → ");

      }


      if (!orderCounts[answerText]) {
        orderCounts[answerText] = 0;
      }


      orderCounts[answerText]++;

    });


    const total =
      currentAnswers.length;


    Object.entries(orderCounts)
      .sort((a,b) => b[1] - a[1])
      .forEach(([answer, count]) => {

        const percent =
          total === 0
            ? 0
            : (count / total) * 100;


        const row =
          document.createElement("div");


        row.className =
          "result-row";


        row.innerHTML = `
          <div class="result-label">
            ${answer} : ${count}명
          </div>

          <div class="bar-bg">
            <div
              class="bar"
              style="width:${percent}%">
            </div>
          </div>
        `;


        resultBars.appendChild(row);

      });


    if (total === 0) {

      resultBars.innerHTML =
        "<div style='color:#777;'>응답이 없습니다.</div>";

    }


    return;

  }


  /*
    일반 선택형 / OX
  */

  const counts = {};


  q.options.forEach(
    option => {
      counts[option] = 0;
    }
  );


  currentAnswers.forEach(data => {

    if (
      counts[data.answer] !== undefined
    ) {

      counts[data.answer]++;

    }

  });


  const total =
    currentAnswers.length;


  q.options.forEach(option => {

    const count =
      counts[option] || 0;


    const percent =
      total === 0
        ? 0
        : (count / total) * 100;


    const row =
      document.createElement("div");


    row.className =
      "result-row";


    row.innerHTML = `
      <div class="result-label">
        ${option} : ${count}명
      </div>

      <div class="bar-bg">
        <div
          class="bar"
          style="width:${percent}%">
        </div>
      </div>
    `;


    resultBars.appendChild(row);

  });

}


/* ==============================

============================== */

window.showRanking = async function() {
  if (!adminAuthenticated) { alert("관리자 로그인이 필요합니다."); return; }

  const list =
    document.getElementById("rankingList");

  list.innerHTML = "";


  /* 퀴즈 종료 후에는 누적 최종 순위 */
  if (quizMode === "finished") {

    const snapshot =
      await get(
        ref(database, "questionScores")
      );

    const totals = {};

    snapshot.forEach(questionChild => {

      questionChild.forEach(scoreChild => {

        const data =
          scoreChild.val();

        const id =
          data.participantId ||
          data.nickname;

        if (!totals[id]) {
          totals[id] = {
            nickname: data.nickname,
            score: 0
          };
        }

        totals[id].score +=
          Number(data.score) || 0;

      });

    });


    const sorted =
      Object.values(totals)
        .sort((a,b) => b.score - a.score);


    document.getElementById("rankingTitle")
      .textContent =
      "🏆 HU Quiz 최종 결과";


    if (sorted.length === 0) {

      list.innerHTML =
        "<div class='rank-item'>점수 데이터가 없습니다.</div>";

    } else {

      sorted.slice(0,3)
        .forEach((item,index) => {

          const div =
            document.createElement("div");

          div.className =
            "rank-item top3";

          const medal =
            index === 0 ? "🥇" :
            index === 1 ? "🥈" : "🥉";

          div.textContent =
            medal +
            " " +
            item.nickname +
            "  " +
            item.score +
            "점";

          list.appendChild(div);

        });

    }

    document.getElementById("rankCloseButton")
      .style.display =
      "none";

  } else {

    /* 진행 중에는 현재 문제 순위만 */
    const snapshot =
      await get(
        ref(
          database,
          "questionScores/" + currentQuestion
        )
      );

    const rows = [];

    snapshot.forEach(child => {
      rows.push(child.val());
    });

    rows.sort((a,b) => {

      if (
        Number(b.score) !==
        Number(a.score)
      ) {
        return Number(b.score) -
               Number(a.score);
      }

      return Number(a.submittedAt) -
             Number(b.submittedAt);

    });


    document.getElementById("rankingTitle")
      .textContent =
      "⚡ 이번 문제 순위";


    if (rows.length === 0) {

      list.innerHTML =
        "<div class='rank-item'>정답자가 없습니다.</div>";

    } else {

      rows.slice(0,6)
        .forEach((item,index) => {

          const div =
            document.createElement("div");

          div.className =
            index < 3
              ? "rank-item top3"
              : "rank-item lower";

          const prefix =
            index === 0 ? "🥇" :
            index === 1 ? "🥈" :
            index === 2 ? "🥉" :
            (index + 1) + "위";

          div.textContent =
            prefix +
            " " +
            item.nickname +
            "  " +
            item.score +
            "점";

          list.appendChild(div);

        });

    }


    document.getElementById("rankCloseButton")
      .style.display =
      "inline-block";

  }


  document.getElementById("ranking")
    .style.display =
    "block";

};


window.closeRanking = function() {
  if (!adminAuthenticated) { alert("관리자 로그인이 필요합니다."); return; }

  if (quizMode !== "result") {
    return;
  }

  document.getElementById("ranking")
    .style.display =
    "none";

};

    return;
  }

  /* 마지막 문제 종료 */

    currentQuestion >=

    document.getElementById("status")
      .textContent =
      "퀴즈 종료";


    document.getElementById("questionNumber")
      .textContent =
      "퀴즈 종료";


    document.getElementById("questionText")
      .innerHTML =
      "🎉 수고하셨습니다!";


    document.getElementById("options")
      .innerHTML =
      "";


    document.getElementById("responseArea")
      .style.display =
      "none";

    document.getElementById("timerPanel")
      .style.display =
      "none";

    document.getElementById("questionMeta")
      .style.display =
      "none";


    document.getElementById("resultArea")
      .style.display =
      "none";


    document.getElementById("nextButton")
      .style.display =
      "none";


    document.getElementById("answerButton")
      .style.display =
      "none";


    document.getElementById("rankButton")
      .style.display =
      "none";


    await set(

      }
    );

    /*

  await set(

  displayQuestion();

  document.getElementById("status")

  document.getElementById("responseArea")
    .style.display =
    "block";

  document.getElementById("timerPanel")
    .style.display =
    "block";

  document.getElementById("questionMeta")
    .style.display =
    "block";


  document.getElementById("responseCount")
    .textContent =
    "0";


  document.getElementById("resultArea")
    .style.display =
    "none";


  document.getElementById("ranking")
    .style.display =
    "none";


  document.getElementById("answerButton")
    .style.display =
    "inline-block";


  document.getElementById("rankButton")
    .style.display =
    "none";


  document.getElementById("nextButton")
    .style.display =
    "none";


  updateManagementState();

};


/* ==============================
   참가자 실시간 표시
============================== */

onValue(
  ref(database, "participants"),
  (snapshot) => {

    let count = 0;

    const names = [];


    snapshot.forEach(child => {

      const data =
        child.val();


      count++;


      if (data.nickname) {

        names.push(
          data.nickname
        );

      }

    });


    document.getElementById(
      "participantCount"
    ).textContent =
      count;


    document.getElementById(
      "participantList"
    ).textContent =
      names.join(" · ");

  }
);


/* ==============================
   현재 문제 답변 실시간 수신
============================== */

onValue(
  ref(database, "answers"),
  (snapshot) => {

    currentAnswers = [];


    snapshot.forEach(child => {

      const data =
        child.val();


      if (
        Number(data.question) ===
        currentQuestion
      ) {

        currentAnswers.push(
          data
        );

      }

    });


    document.getElementById(
      "responseCount"
    ).textContent =
      currentAnswers.length;

  }
);


/* ==============================
   초기 관리 상태
============================== */

updateManagementState();

</script>
