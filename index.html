<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HU Quiz</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f4f6f9;
      text-align: center;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 25px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 35px;
    }

    input {
      width: 100%;
      max-width: 400px;
      margin: 0 auto 15px;
      padding: 18px;
      font-size: 20px;
      border: 1px solid #ccc;
      border-radius: 12px;
    }

    .join-button {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      padding: 18px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: #222;
      color: white;
      cursor: pointer;
    }

    #quizScreen {
      display: none;
      min-height: 100vh;
    }

    .question {
      padding: 25px 15px;
      font-size: 25px;
      font-weight: bold;
      background: white;
    }

    .answers {
      display: flex;
      height: calc(100vh - 110px);
    }

    .answer {
      width: 50%;
      border: none;
      font-size: 32px;
      font-weight: bold;
      color: white;
      cursor: pointer;
    }

    .answer1 { background: #e74c3c; }
    .answer2 { background: #3498db; }

    .selected {
      outline: 8px solid #222;
      outline-offset: -8px;
    }

    .answer:disabled {
      cursor: default;
      opacity: 0.65;
    }

    .answer.selected:disabled {
      opacity: 1;
    }
  </style>
</head>

<body>

  <div id="joinScreen" class="screen">
    <h1>HU Quiz</h1>
    <div class="subtitle">교육용 참여형 퀴즈</div>

    <input
      id="nickname"
      type="text"
      placeholder="닉네임을 입력하세요"
    >

    <button class="join-button" onclick="joinQuiz()">
      입장하기
    </button>
  </div>


  <div id="quizScreen">

    <div class="question">
      탕수육을 먹을 때 당신의 선택은?
    </div>

    <div class="answers">

      <button
        class="answer answer1"
        onclick="selectAnswer(this, '부먹')"
      >
        ①<br>부먹
      </button>

      <button
        class="answer answer2"
        onclick="selectAnswer(this, '찍먹')"
      >
        ②<br>찍먹
      </button>

    </div>
  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      push,
      set
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";


    const firebaseConfig = {
      apiKey: "AIzaSyAYszYNkItL6kfrpJ5An7Z_AgDVY4nmUbg",
      authDomain: "hu-quiz.firebaseapp.com",
      databaseURL: "https://hu-quiz-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "hu-quiz",
      storageBucket: "hu-quiz.firebasestorage.app",
      messagingSenderId: "344334242719",
      appId: "1:344334242719:web:b87436d3cba0fafd6ca3aa"
    };


    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    let nickname = "";
    let submitted = false;


    window.joinQuiz = function () {

      nickname =
        document.getElementById("nickname").value.trim();

      if (nickname === "") {
        alert("닉네임을 입력해주세요.");
        return;
      }

      document.getElementById("joinScreen").style.display = "none";
      document.getElementById("quizScreen").style.display = "block";
    };


    window.selectAnswer = async function (button, answer) {

      if (submitted) {
        return;
      }

      submitted = true;

      document.querySelectorAll(".answer")
        .forEach(btn => btn.disabled = true);

      button.classList.add("selected");

      try {

        const answersRef =
          ref(database, "answers");

        const newAnswerRef =
          push(answersRef);

        await set(newAnswerRef, {
          nickname: nickname,
          answer: answer,
          submittedAt: Date.now()
        });

        alert(nickname + "님, 답변이 제출되었습니다!");

      } catch (error) {

        submitted = false;

        document.querySelectorAll(".answer")
          .forEach(btn => btn.disabled = false);

        button.classList.remove("selected");

        alert("답변 전송에 실패했습니다.");
        console.error(error);
      }
    };

  </script>

</body>
</html>
