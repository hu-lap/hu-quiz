<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HU Quiz</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f4f6f9;
      text-align: center;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 25px;
    }

    h1 {
      font-size: 42px;
      margin: 0 0 10px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 35px;
    }

    input {
      width: 100%;
      max-width: 400px;
      margin: 0 auto 15px;
      padding: 18px;
      font-size: 20px;
      border: 1px solid #ccc;
      border-radius: 12px;
    }

    .main-button {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      padding: 18px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: #222;
      color: white;
      cursor: pointer;
    }

    #waitingScreen,
    #quizScreen,
    #submittedScreen {
      display: none;
    }

    .waiting-box {
      background: white;
      max-width: 500px;
      margin: 0 auto;
      padding: 40px 25px;
      border-radius: 20px;
    }

    .waiting-name {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .waiting-message {
      font-size: 20px;
      color: #555;
      line-height: 1.6;
    }

    #quizScreen {
      min-height: 100vh;
      background: #f4f6f9;
    }

    .question-number {
      padding-top: 25px;
      font-size: 18px;
      color: #777;
    }

    .question {
      padding: 15px 20px 25px;
      font-size: 28px;
      font-weight: bold;
    }

    .answers {
      display: flex;
      min-height: calc(100vh - 130px);
    }

    .answer {
      width: 50%;
      border: none;
      font-size: 32px;
      font-weight: bold;
      color: white;
      cursor: pointer;
    }

    .answer1 { background: #e74c3c; }
    .answer2 { background: #3498db; }

    .answer:disabled {
      cursor: default;
      opacity: 0.6;
    }

    .answer.selected {
      outline: 8px solid #222;
      outline-offset: -8px;
      opacity: 1;
    }

    .submitted-box {
      background: white;
      max-width: 500px;
      margin: 0 auto;
      padding: 45px 25px;
      border-radius: 20px;
    }

    .check {
      font-size: 60px;
      margin-bottom: 15px;
    }

    .submitted-title {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .submitted-message {
      color: #666;
      font-size: 18px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <!-- 닉네임 입력 -->
  <div id="joinScreen" class="screen">
    <h1>HU Quiz</h1>
    <div class="subtitle">교육용 참여형 퀴즈</div>

    <input
      id="nickname"
      type="text"
      placeholder="닉네임을 입력하세요"
    >

    <button class="main-button" onclick="joinQuiz()">
      입장하기
    </button>
  </div>


  <!-- 강사 시작 대기 -->
  <div id="waitingScreen" class="screen">
    <div class="waiting-box">

      <div id="waitingName" class="waiting-name"></div>

      <div class="waiting-message">
        입장이 완료되었습니다.<br><br>
        강사가 퀴즈를 시작할 때까지<br>
        잠시 기다려 주세요.
      </div>

    </div>
  </div>


  <!-- 문제 화면 -->
  <div id="quizScreen">

    <div class="question-number">
      문제 1
    </div>

    <div class="question">
      탕수육을 먹을 때 당신의 선택은?
    </div>

    <div class="answers">

      <button
        class="answer answer1"
        onclick="selectAnswer(this, '부먹')"
      >
        ①<br>부먹
      </button>

      <button
        class="answer answer2"
        onclick="selectAnswer(this, '찍먹')"
      >
        ②<br>찍먹
      </button>

    </div>

  </div>


  <!-- 답변 제출 후 -->
  <div id="submittedScreen" class="screen">

    <div class="submitted-box">

      <div class="check">✓</div>

      <div class="submitted-title">
        답변 제출 완료
      </div>

      <div class="submitted-message">
        답변이 제출되었습니다.<br>
        강사의 진행을 기다려 주세요.
      </div>

    </div>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      push,
      set,
      onValue
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";


    const firebaseConfig = {
      apiKey: "AIzaSyAYszYNkItL6kfrpJ5An7Z_AgDVY4nmUbg",
      authDomain: "hu-quiz.firebaseapp.com",
      databaseURL: "https://hu-quiz-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "hu-quiz",
      storageBucket: "hu-quiz.firebasestorage.app",
      messagingSenderId: "344334242719",
      appId: "1:344334242719:web:b87436d3cba0fafd6ca3aa"
    };


    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    let nickname = "";
    let submitted = false;
    let joined = false;


    function showScreen(screenId) {

      document.getElementById("joinScreen").style.display = "none";
      document.getElementById("waitingScreen").style.display = "none";
      document.getElementById("quizScreen").style.display = "none";
      document.getElementById("submittedScreen").style.display = "none";

      const target = document.getElementById(screenId);

      if (screenId === "quizScreen") {
        target.style.display = "block";
      } else {
        target.style.display = "flex";
      }
    }


    window.joinQuiz = function () {

      nickname =
        document.getElementById("nickname").value.trim();

      if (nickname === "") {
        alert("닉네임을 입력해주세요.");
        return;
      }

      joined = true;

      document.getElementById("waitingName").textContent =
        nickname + "님";

      showScreen("waitingScreen");
    };


    window.selectAnswer = async function (button, answer) {

      if (submitted) return;

      submitted = true;

      document.querySelectorAll(".answer")
        .forEach(btn => btn.disabled = true);

      button.classList.add("selected");

      try {

        const answersRef = ref(database, "answers");
        const newAnswerRef = push(answersRef);

        await set(newAnswerRef, {
          nickname: nickname,
          question: 1,
          answer: answer,
          submittedAt: Date.now()
        });

        setTimeout(function () {
          showScreen("submittedScreen");
        }, 500);

      } catch (error) {

        submitted = false;

        document.querySelectorAll(".answer")
          .forEach(btn => btn.disabled = false);

        button.classList.remove("selected");

        alert("답변 전송에 실패했습니다.");
        console.error(error);
      }
    };


    /*
      Firebase의 quizState를 계속 감시한다.

      waiting = 대기
      question = 문제 표시
    */

    const stateRef = ref(database, "quizState");

    onValue(stateRef, function(snapshot) {

      if (!joined) return;

      const state = snapshot.val();

      if (!state) {
        showScreen("waitingScreen");
        return;
      }

      if (state.status === "waiting") {
        showScreen("waitingScreen");
      }

      if (state.status === "question") {

        if (!submitted) {
          showScreen("quizScreen");
        }

      }

    });

  </script>

</body>
</html>
