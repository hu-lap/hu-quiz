<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HU Quiz</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, "Noto Sans KR", sans-serif;
  background: #f4f6f9;
  color: #222;
}

.screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 24px;
  text-align: center;
}

#waitingScreen,
#quizScreen,
#submittedScreen,
#resultScreen,
#finishedScreen {
  display: none;
}

h1 {
  font-size: 42px;
  margin: 0 0 8px;
}

.subtitle {
  color: #666;
  margin-bottom: 35px;
}

input {
  width: 100%;
  max-width: 420px;
  margin: 0 auto 15px;
  padding: 18px;
  font-size: 20px;
  border: 1px solid #ccc;
  border-radius: 12px;
}

.main-button {
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
  padding: 18px;
  border: none;
  border-radius: 12px;
  background: #222;
  color: white;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}

.card {
  width: 100%;
  max-width: 520px;
  margin: auto;
  padding: 35px 22px;
  background: white;
  border-radius: 20px;
}

.big-name {
  font-size: 27px;
  font-weight: bold;
  margin-bottom: 20px;
}

.message {
  color: #666;
  font-size: 19px;
  line-height: 1.6;
}


/* 문제 화면 */

#quizScreen {
  min-height: 100vh;
  padding: 20px;
}

.question-number {
  text-align: center;
  color: #777;
  font-size: 17px;
  margin-top: 8px;
}

.question {
  text-align: center;
  font-size: 27px;
  font-weight: bold;
  padding: 18px 5px 25px;
}

.answers {
  max-width: 650px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.answer {
  min-height: 125px;
  padding: 18px 10px;
  border: none;
  border-radius: 16px;
  color: white;
  font-size: 23px;
  font-weight: bold;
  cursor: pointer;
}

.color1 { background: #e74c3c; }
.color2 { background: #3498db; }
.color3 { background: #f39c12; }
.color4 { background: #27ae60; }

.answer.selected {
  outline: 7px solid #222;
  outline-offset: -7px;
}

.answer.used {
  opacity: 0.45;
}

.answer:disabled {
  cursor: default;
}


/* 순서 문제 */

.order-info {
  display: none;
  max-width: 650px;
  margin: 18px auto;
  padding: 16px;
  background: white;
  border-radius: 12px;
  text-align: center;
}

.order-title {
  color: #666;
  margin-bottom: 8px;
}

#orderDisplay {
  font-size: 24px;
  font-weight: bold;
  min-height: 30px;
}

.order-controls {
  display: none;
  max-width: 650px;
  margin: 15px auto;
  text-align: center;
}

.small-button {
  padding: 14px 22px;
  margin: 5px;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.reset-button {
  background: #ddd;
}

.submit-button {
  background: #222;
  color: white;
}


/* 제한시간 */
.timer-wrap {
  max-width: 650px;
  margin: 0 auto 18px;
  text-align: center;
}

.timer-label {
  font-size: 15px;
  color: #777;
  margin-bottom: 6px;
}

.timer-value {
  font-size: 34px;
  font-weight: bold;
}

.timer-bar-bg {
  width: 100%;
  height: 10px;
  margin-top: 8px;
  background: #ddd;
  border-radius: 999px;
  overflow: hidden;
}

.timer-bar {
  height: 100%;
  width: 100%;
  background: #222;
  transition: width 0.1s linear;
}

.time-over {
  margin: 16px auto 0;
  max-width: 650px;
  padding: 14px;
  border-radius: 12px;
  background: #fff3cd;
  color: #6b5700;
  font-weight: bold;
  display: none;
}


/* 결과 */

.result-symbol {
  font-size: 65px;
  margin-bottom: 10px;
}

.result-title {
  font-size: 29px;
  font-weight: bold;
  margin-bottom: 15px;
}

.my-answer {
  font-size: 19px;
  margin: 18px 0;
}

.correct-answer {
  font-size: 20px;
  font-weight: bold;
  margin: 18px 0;
}

.explanation {
  color: #555;
  line-height: 1.6;
  margin-top: 20px;
}
</style>
</head>


<body>

<!-- 입장 -->
<div id="joinScreen" class="screen">

  <h1>HU Quiz</h1>

  <div class="subtitle">
    교육용 참여형 퀴즈
  </div>

  <input
    id="nickname"
    type="text"
    placeholder="닉네임을 입력하세요">

  <button
    class="main-button"
    onclick="joinQuiz()">
    입장하기
  </button>

</div>


<!-- 대기 -->
<div id="waitingScreen" class="screen">

  <div class="card">

    <div
      id="waitingName"
      class="big-name">
    </div>

    <div class="message">
      입장이 완료되었습니다.<br><br>
      강사가 퀴즈를 시작할 때까지<br>
      잠시 기다려 주세요.
    </div>

  </div>

</div>


<!-- 문제 -->
<div id="quizScreen">

  <div
    id="questionNumber"
    class="question-number">
  </div>

  <div id="timerWrap" class="timer-wrap">
    <div class="timer-label">남은 시간</div>
    <div id="timerValue" class="timer-value">--</div>
    <div class="timer-bar-bg">
      <div id="timerBar" class="timer-bar"></div>
    </div>
  </div>

  <div id="timeOverMessage" class="time-over">
    ⏰ 제한시간이 종료되었습니다.
  </div>

  <div
    id="questionText"
    class="question">
  </div>

  <div
    id="answers"
    class="answers">
  </div>


  <div
    id="orderInfo"
    class="order-info">

    <div class="order-title">
      내가 선택한 순서
    </div>

    <div id="orderDisplay">
      아직 선택하지 않았습니다.
    </div>

  </div>


  <div
    id="orderControls"
    class="order-controls">

    <button
      class="small-button reset-button"
      onclick="resetOrder()">
      다시 선택
    </button>

    <button
      class="small-button submit-button"
      onclick="submitOrder()">
      답변 제출
    </button>

  </div>

</div>


<!-- 제출 완료 -->
<div id="submittedScreen" class="screen">

  <div class="card">

    <div class="result-symbol">✓</div>

    <div class="result-title">
      답변 제출 완료
    </div>

    <div class="message">
      답변이 제출되었습니다.<br>
      강사의 정답 공개를 기다려 주세요.
    </div>

  </div>

</div>


<!-- 정답 결과 -->
<div id="resultScreen" class="screen">

  <div class="card">

    <div
      id="resultSymbol"
      class="result-symbol">
    </div>

    <div
      id="resultTitle"
      class="result-title">
    </div>

    <div
      id="myAnswer"
      class="my-answer">
    </div>

    <div
      id="correctAnswer"
      class="correct-answer">
    </div>

    <div
      id="explanation"
      class="explanation">
    </div>

    <br>

    <div class="message">
      다음 문제를 기다려 주세요.
    </div>

  </div>

</div>


<!-- 종료 -->
<div id="finishedScreen" class="screen">

  <div class="card">

    <div class="result-symbol">🏁</div>

    <div class="result-title">
      퀴즈가 종료되었습니다.
    </div>

    <div class="message">
      참여해 주셔서 감사합니다.
    </div>

  </div>

</div>



<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  set,
  onValue,
  serverTimestamp,
  get
}
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

import { getAuth, signInAnonymously, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyAYszYNkItL6kfrpJ5An7Z_AgDVY4nmUbg",

  authDomain:
    "hu-quiz.firebaseapp.com",

  databaseURL:
    "https://hu-quiz-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "hu-quiz",

  storageBucket:
    "hu-quiz.firebasestorage.app",

  messagingSenderId:
    "344334242719",

  appId:
    "1:344334242719:web:b87436d3cba0fafd6ca3aa"

};


const app = initializeApp(firebaseConfig);
const database = getDatabase(app);
const auth = getAuth(app);
let studentAuthReady = null;
const authReady = new Promise(resolve => { studentAuthReady = resolve; });
onAuthStateChanged(auth, async user => {
  if (user) { studentAuthReady(user); return; }
  try {
    const credential = await signInAnonymously(auth);
    studentAuthReady(credential.user);
  } catch (error) {
    console.error("익명 인증 실패:", error);
    studentAuthReady(null);
  }
});



/* ------------------------
   샘플 문제
------------------------- */

const sampleQuestions = [

  {
    type: "choice",

    text:
      "탕수육을 먹을 때 당신의 선택은?",

    options:
      ["부먹", "찍먹"],

    correct:
      "찍먹",

    explanation:
      "샘플 문제입니다. 정답은 찍먹으로 설정했습니다."
  },


  {
    type: "ox",

    text:
      "대한민국의 수도는 서울이다.",

    options:
      ["O", "X"],

    correct:
      "O",

    explanation:
      "대한민국의 수도는 서울입니다."
  },


  {
    type: "choice",

    text:
      "다음 중 우리나라의 수도는 어디일까요?",

    options:
      ["서울", "부산", "대전", "제주"],

    correct:
      "서울",

    explanation:
      "대한민국의 수도는 서울입니다."
  },


  {
    type: "order",

    text:
      "다음 숫자를 작은 수부터 순서대로 선택하세요.",

    options:
      ["3", "1", "4", "2"],

    correct:
      ["1", "2", "3", "4"],

    explanation:
      "작은 수부터 배열하면 1 → 2 → 3 → 4입니다."
  }

];



let questions = sampleQuestions;
let nickname = "";

let joined = false;

let currentQuestion = -1;

let submittedQuestion = -1;

let myAnswer = null;

let orderSelection = [];

let participantId = "";

let questionStartedAt = null;

let questionDurationSec = 10;

let timerInterval = null;

let timeExpired = false;

let serverTimeOffset = 0;
let latestQuizState = null;
let answerSaving = false;
const participantStorageKey = "huQuizParticipant_v2";
const resetStorageKey = "huQuizLastReset_v1";

function storeParticipant() {
  sessionStorage.setItem(participantStorageKey, JSON.stringify({
    participantId, nickname, ownerUid: auth.currentUser?.uid || ""
  }));
}

function rememberAnswer(questionNumber, answer) {
  sessionStorage.setItem("huQuizAnswer_" + participantId + "_" + questionNumber,
    JSON.stringify(answer));
}

function restoreAnswer(questionNumber) {
  const saved = sessionStorage.getItem("huQuizAnswer_" + participantId + "_" + questionNumber);
  if (saved === null) return false;
  try {
    myAnswer = JSON.parse(saved);
    submittedQuestion = questionNumber;
    return true;
  } catch (e) { return false; }
}

async function restoreParticipant() {
  const user = await authReady;
  if (!user || !user.isAnonymous) return;
  let saved;
  try { saved = JSON.parse(sessionStorage.getItem(participantStorageKey) || "null"); }
  catch (e) { return; }
  if (!saved || !saved.participantId || saved.ownerUid !== user.uid) return;
  try {
    const snap = await get(ref(database, "participants/" + saved.participantId));
    const record = snap.val();
    if (!record || record.ownerUid !== user.uid) {
      sessionStorage.removeItem(participantStorageKey);
      return;
    }
    participantId = saved.participantId;
    nickname = record.nickname;
    joined = true;
    if (latestQuizState?.resetAt && !sessionStorage.getItem(resetStorageKey)) {
      sessionStorage.setItem(resetStorageKey, String(latestQuizState.resetAt));
    }
    document.getElementById("waitingName").textContent = nickname + "님";
    applyQuizState(latestQuizState);
  } catch (error) {
    console.error("참가자 복원 실패:", error);
  }
}




/* ------------------------
   Firebase 서버시간 보정
------------------------- */

onValue(
  ref(database, ".info/serverTimeOffset"),
  snapshot => {
    serverTimeOffset = Number(snapshot.val()) || 0;
  }
);

function serverNow() {
  return Date.now() + serverTimeOffset;
}


/* ------------------------
   화면 전환
------------------------- */

function showScreen(id) {

  const screens = [
    "joinScreen",
    "waitingScreen",
    "quizScreen",
    "submittedScreen",
    "resultScreen",
    "finishedScreen"
  ];

  screens.forEach(screen => {

    document.getElementById(screen)
      .style.display = "none";

  });


  const target =
    document.getElementById(id);


  if (id === "quizScreen") {

    target.style.display = "block";

  } else {

    target.style.display = "flex";

  }

}



/* ------------------------
   입장
------------------------- */

window.joinQuiz = async function() {

  nickname =
    document.getElementById("nickname")
      .value.trim();


  if (!nickname) {

    alert("닉네임을 입력해주세요.");

    return;

  }


  try {
    const studentUser = await authReady;
    if (!studentUser || studentUser.isAnonymous !== true) {
      alert("교육생 인증에 실패했습니다. 페이지를 새로고침한 뒤 다시 시도해주세요.");
      return;
    }

    // Firebase에 참가자 등록
    const newParticipantRef =
      push(
        ref(database, "participants")
      );


    participantId =
      newParticipantRef.key;


    await set(
      newParticipantRef,
      {
        nickname: nickname,
        ownerUid: studentUser.uid,
        joinedAt: serverTimestamp()
      }
    );


    joined = true;
    if (latestQuizState?.resetAt) sessionStorage.setItem(resetStorageKey, String(latestQuizState.resetAt));
    storeParticipant();


    document.getElementById("waitingName")
      .textContent =
      nickname + "님";


    showScreen("waitingScreen");
    applyQuizState(latestQuizState);


  } catch(error) {

    alert("입장에 실패했습니다. 다시 시도해주세요.");

    console.error(error);

  }

};


/* ------------------------
   제한시간
------------------------- */

function stopTimer() {

  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }

}


function lockAnswerInput() {

  document.querySelectorAll(".answer")
    .forEach(btn => {
      btn.disabled = true;
    });

  const submitButton =
    document.querySelector(".submit-button");

  const resetButton =
    document.querySelector(".reset-button");

  if (submitButton) {
    submitButton.disabled = true;
  }

  if (resetButton) {
    resetButton.disabled = true;
  }

}


function expireQuestion() {

  if (timeExpired) return;

  timeExpired = true;

  stopTimer();

  document.getElementById("timerValue")
    .textContent = "0.0초";

  document.getElementById("timerBar")
    .style.width = "0%";

  document.getElementById("timeOverMessage")
    .style.display = "block";

  if (
    submittedQuestion !==
    currentQuestion
  ) {
    lockAnswerInput();
  }

}


function startTimer(startedAt, durationSec) {

  stopTimer();

  questionStartedAt =
    Number(startedAt);

  questionDurationSec =
    Number(durationSec) || 10;

  timeExpired = false;

  document.getElementById("timeOverMessage")
    .style.display = "none";

  const submitButton =
    document.querySelector(".submit-button");

  const resetButton =
    document.querySelector(".reset-button");

  if (submitButton) {
    submitButton.disabled = false;
  }

  if (resetButton) {
    resetButton.disabled = false;
  }


  const update = () => {

    if (!questionStartedAt) {
      return;
    }

    const elapsedMs =
      serverNow() - questionStartedAt;

    const totalMs =
      questionDurationSec * 1000;

    const remainingMs =
      Math.max(0, totalMs - elapsedMs);

    const remainingSec =
      remainingMs / 1000;

    document.getElementById("timerValue")
      .textContent =
      remainingSec.toFixed(1) + "초";

    const percent =
      Math.max(
        0,
        Math.min(
          100,
          (remainingMs / totalMs) * 100
        )
      );

    document.getElementById("timerBar")
      .style.width =
      percent + "%";


    if (remainingMs <= 0) {
      expireQuestion();
    }

  };


  update();

  timerInterval =
    setInterval(update, 100);

}


/* ------------------------
   문제 표시
------------------------- */

function displayQuestion(questionIndex, state) {

  currentQuestion = questionIndex;

  submittedQuestion = -1;

  myAnswer = null;

  orderSelection = [];

  restoreAnswer(questionIndex);
  timeExpired = false;

  document.getElementById("timeOverMessage")
    .style.display = "none";


  const q =
    questions[currentQuestion];


  document.getElementById("questionNumber")
    .textContent =
    "문제 " +
    (currentQuestion + 1) +
    " / " +
    questions.length;


  document.getElementById("questionText")
    .textContent =
    q.text;


  const answers =
    document.getElementById("answers");


  answers.innerHTML = "";


  document.getElementById("orderInfo")
    .style.display = "none";

  document.getElementById("orderControls")
    .style.display = "none";


  q.options.forEach((option, index) => {

    const button =
      document.createElement("button");


    button.className =
      "answer color" +
      ((index % 4) + 1);


    button.textContent =
      (index + 1) +
      ". " +
      option;


    if (q.type === "order") {

      button.onclick = function() {

        selectOrder(
          button,
          option
        );

      };

    } else {

      button.onclick = function() {

        submitChoice(
          button,
          option
        );

      };

    }


    answers.appendChild(button);

  });


  if (q.type === "order") {

    document.getElementById("orderInfo")
      .style.display = "block";

    document.getElementById("orderControls")
      .style.display = "block";

    updateOrderDisplay();

  }


  showScreen("quizScreen");


  const durationSec =
    state && state.durationSec
      ? Number(state.durationSec)
      : 10;

  const startedAt =
    state && state.startedAt
      ? Number(state.startedAt)
      : serverNow();

  if (submittedQuestion === currentQuestion) {
    stopTimer();
    showScreen("submittedScreen");
  } else {
    startTimer(startedAt, durationSec);
  }

}



/* ------------------------
   일반/OX 선택
------------------------- */

async function submitChoice(
  button,
  answer
) {

  if (
    submittedQuestion ===
    currentQuestion ||
    timeExpired
  ) return;


  document.querySelectorAll(".answer")
    .forEach(btn => {

      btn.disabled = true;

    });


  button.classList.add("selected");


  myAnswer = answer;


  await saveAnswer(answer);

}



/* ------------------------
   순서 선택
------------------------- */

function selectOrder(
  button,
  option
) {

  if (
    submittedQuestion ===
    currentQuestion ||
    timeExpired
  ) return;


  if (
    orderSelection.includes(option)
  ) return;


  orderSelection.push(option);


  button.classList.add("used");

  button.disabled = true;


  updateOrderDisplay();

}



function updateOrderDisplay() {

  const display =
    document.getElementById("orderDisplay");


  if (orderSelection.length === 0) {

    display.textContent =
      "아직 선택하지 않았습니다.";

  } else {

    display.textContent =
      orderSelection.join(" → ");

  }

}



window.resetOrder = function() {

  if (
    submittedQuestion ===
    currentQuestion ||
    timeExpired
  ) return;


  orderSelection = [];


  document.querySelectorAll(".answer")
    .forEach(btn => {

      btn.disabled = false;

      btn.classList.remove("used");

    });


  updateOrderDisplay();

};



window.submitOrder = async function() {

  if (timeExpired || answerSaving || submittedQuestion === currentQuestion) {
    return;
  }

  const q =
    questions[currentQuestion];


  if (
    orderSelection.length !==
    q.options.length
  ) {

    alert(
      "모든 항목을 순서대로 선택해주세요."
    );

    return;

  }


  myAnswer =
    [...orderSelection];


  document.querySelectorAll(".answer")
    .forEach(btn => {

      btn.disabled = true;

    });


  await saveAnswer(myAnswer);

};



/* ------------------------
   Firebase 답변 저장
------------------------- */

async function saveAnswer(answer) {

  if (timeExpired || answerSaving || submittedQuestion === currentQuestion) {
    return;
  }

  answerSaving = true;
  const savingQuestion = currentQuestion;

  // 문제 번호 + 참가자 ID를 고정 키로 사용해 중복 답변을 구분합니다.
  // 서버 보안규칙에서 기존 키의 덮어쓰기를 금지해야 최종적으로 보호됩니다.
  const answerRef = ref(database, "answers/" + currentQuestion + "_" + participantId);

  try {

    await set(
      answerRef,
      {

        participantId:
          participantId,
        ownerUid: auth.currentUser?.uid || "",

        nickname:
          nickname,

        question:
          currentQuestion,

        answer:
          answer,

        submittedAt:
          serverTimestamp()

      }
    );


    rememberAnswer(savingQuestion, answer);
    submittedQuestion = savingQuestion;
    stopTimer();


    showScreen(
      "submittedScreen"
    );


  } catch(error) {

    alert(
      "답변 전송에 실패했습니다."
    );

    console.error(error);
    if (!timeExpired && currentQuestion === savingQuestion) {
      document.querySelectorAll(".answer").forEach(btn => { btn.disabled = false; });
      const submitButton = document.querySelector(".submit-button");
      if (submitButton) submitButton.disabled = false;
    }
  } finally {
    answerSaving = false;
  }

}



/* ------------------------
   정답 결과 표시
------------------------- */

function showResult() {

  stopTimer();

  const q =
    questions[currentQuestion];


  if (
    submittedQuestion !==
    currentQuestion
  ) {

    /*
      답을 제출하지 않은 경우도
      정답 공개 화면은 볼 수 있다.
    */

    myAnswer = null;

  }


  let isCorrect = false;


  if (myAnswer !== null) {

    if (q.type === "order") {

      isCorrect =
        JSON.stringify(myAnswer) ===
        JSON.stringify(q.correct);

    } else {

      isCorrect =
        myAnswer === q.correct;

    }

  }


  document.getElementById("resultSymbol")
    .textContent =
    isCorrect ? "⭕" : "❌";


  document.getElementById("resultTitle")
    .textContent =
    isCorrect ?
    "정답입니다!" :
    "아쉽네요!";


  let myText =
    "미제출";


  if (myAnswer !== null) {

    myText =
      Array.isArray(myAnswer) ?
      myAnswer.join(" → ") :
      myAnswer;

  }


  let correctText =
    Array.isArray(q.correct) ?
    q.correct.join(" → ") :
    q.correct;


  document.getElementById("myAnswer")
    .textContent =
    "내 답 : " +
    myText;


  document.getElementById("correctAnswer")
    .textContent =
    "정답 : " +
    correctText;


  document.getElementById("explanation")
    .textContent =
    q.explanation;


  showScreen("resultScreen");

}



/* ------------------------
   강사 진행상태 감시 및 재접속 복구
------------------------- */

function applyQuizState(state) {
  if (state && Array.isArray(state.questions) && state.questions.length) questions = state.questions;
  if (!joined) return;
  if (!state) {
    stopTimer();
    showScreen("waitingScreen");
    return;
  }

  if (state.status === "question") {
    const newQuestion = Number(state.question);
    if (!Number.isInteger(newQuestion) || newQuestion < 0 || newQuestion >= questions.length) return;
    if (newQuestion !== currentQuestion) {
      displayQuestion(newQuestion, state);
    } else if (submittedQuestion === currentQuestion) {
      stopTimer();
      showScreen("submittedScreen");
    } else if (!timerInterval && !timeExpired) {
      startTimer(state.startedAt, state.durationSec || 10);
    }
    return;
  }

  if (state.status === "result") {
    const newQuestion = Number(state.question);
    if (!Number.isInteger(newQuestion) || newQuestion < 0 || newQuestion >= questions.length) return;
    if (currentQuestion !== newQuestion) {
      currentQuestion = newQuestion;
      submittedQuestion = -1;
      myAnswer = null;
      restoreAnswer(newQuestion);
    }
    showResult();
    return;
  }

  if (state.status === "waiting") {
    // 강사가 새 퀴즈를 준비했다면 기존 참가자 세션을 폐기하고 재입장 유도
    if (state.resetAt && String(state.resetAt) !== sessionStorage.getItem(resetStorageKey)) {
      sessionStorage.setItem(resetStorageKey, String(state.resetAt));
      sessionStorage.removeItem(participantStorageKey);
      if (participantId) {
        for (let i = 0; i < questions.length; i++) {
          sessionStorage.removeItem("huQuizAnswer_" + participantId + "_" + i);
        }
      }
      joined = false;
      participantId = "";
      nickname = "";
      currentQuestion = -1;
      submittedQuestion = -1;
      myAnswer = null;
      stopTimer();
      showScreen("joinScreen");
      return;
    }
    stopTimer();
    currentQuestion = -1;
    submittedQuestion = -1;
    myAnswer = null;
    showScreen("waitingScreen");
    return;
  }

  if (state.status === "finished") {
    stopTimer();
    showScreen("finishedScreen");
  }
}

onValue(ref(database, "quizState"), snapshot => {
  latestQuizState = snapshot.val();
  applyQuizState(latestQuizState);
}, error => console.error("진행상태 수신 실패:", error));

restoreParticipant();

</script>
