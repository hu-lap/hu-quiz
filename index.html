<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HU Quiz</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, "Noto Sans KR", sans-serif;
  background: #f4f6f9;
  color: #222;
}

.screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 24px;
  text-align: center;
}

#waitingScreen,
#quizScreen,
#submittedScreen,
#resultScreen,
#finishedScreen {
  display: none;
}

h1 {
  font-size: 42px;
  margin: 0 0 8px;
}

.subtitle {
  color: #666;
  margin-bottom: 35px;
}

input {
  width: 100%;
  max-width: 420px;
  margin: 0 auto 15px;
  padding: 18px;
  font-size: 20px;
  border: 1px solid #ccc;
  border-radius: 12px;
}

.main-button {
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
  padding: 18px;
  border: none;
  border-radius: 12px;
  background: #222;
  color: white;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}

.card {
  width: 100%;
  max-width: 520px;
  margin: auto;
  padding: 35px 22px;
  background: white;
  border-radius: 20px;
}

.big-name {
  font-size: 27px;
  font-weight: bold;
  margin-bottom: 20px;
}

.message {
  color: #666;
  font-size: 19px;
  line-height: 1.6;
}


/* 문제 화면 */

#quizScreen {
  min-height: 100vh;
  padding: 20px;
}

.question-number {
  text-align: center;
  color: #777;
  font-size: 17px;
  margin-top: 8px;
}

.question {
  text-align: center;
  font-size: 27px;
  font-weight: bold;
  padding: 18px 5px 25px;
}

.answers {
  max-width: 650px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.answer {
  min-height: 125px;
  padding: 18px 10px;
  border: none;
  border-radius: 16px;
  color: white;
  font-size: 23px;
  font-weight: bold;
  cursor: pointer;
}

.color1 { background: #e74c3c; }
.color2 { background: #3498db; }
.color3 { background: #f39c12; }
.color4 { background: #27ae60; }

.answer.selected {
  outline: 7px solid #222;
  outline-offset: -7px;
}

.answer.used {
  opacity: 0.45;
}

.answer:disabled {
  cursor: default;
}


/* 순서 문제 */

.order-info {
  display: none;
  max-width: 650px;
  margin: 18px auto;
  padding: 16px;
  background: white;
  border-radius: 12px;
  text-align: center;
}

.order-title {
  color: #666;
  margin-bottom: 8px;
}

#orderDisplay {
  font-size: 24px;
  font-weight: bold;
  min-height: 30px;
}

.order-controls {
  display: none;
  max-width: 650px;
  margin: 15px auto;
  text-align: center;
}

.small-button {
  padding: 14px 22px;
  margin: 5px;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.reset-button {
  background: #ddd;
}

.submit-button {
  background: #222;
  color: white;
}


/* 제한시간 */
.timer-wrap {
  max-width: 650px;
  margin: 0 auto 18px;
  text-align: center;
}

.timer-label {
  font-size: 15px;
  color: #777;
  margin-bottom: 6px;
}

.timer-value {
  font-size: 34px;
  font-weight: bold;
}

.timer-bar-bg {
  width: 100%;
  height: 10px;
  margin-top: 8px;
  background: #ddd;
  border-radius: 999px;
  overflow: hidden;
}

.timer-bar {
  height: 100%;
  width: 100%;
  background: #222;
  transition: width 0.1s linear;
}

.time-over {
  margin: 16px auto 0;
  max-width: 650px;
  padding: 14px;
  border-radius: 12px;
  background: #fff3cd;
  color: #6b5700;
  font-weight: bold;
  display: none;
}


/* 결과 */

.result-symbol {
  font-size: 65px;
  margin-bottom: 10px;
}

.result-title {
  font-size: 29px;
  font-weight: bold;
  margin-bottom: 15px;
}

.my-answer {
  font-size: 19px;
  margin: 18px 0;
}

.correct-answer {
  font-size: 20px;
  font-weight: bold;
  margin: 18px 0;
}

.explanation {
  color: #555;
  line-height: 1.6;
  margin-top: 20px;
}

/* HU Quiz A형 - 차분한 원전/인적행위 배경과 반응형 디자인 */
:root{--hu-navy:#183a58;--hu-blue:#397b9c;--hu-ink:#17354c;--hu-soft:#edf3f5;--hu-card:rgba(255,255,255,.94)}
body{font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--hu-ink);background:#edf2f3}
button,input,select,textarea{font-family:inherit}
button{transition:filter .15s,transform .15s}button:active{transform:scale(.985)}
.hu-scene{background-image:linear-gradient(180deg,rgba(232,242,245,.24),rgba(222,235,234,.3)),var(--hu-scene);background-position:center;background-size:cover;background-attachment:fixed}
.hu-question-card{background:var(--hu-card)!important;box-shadow:0 12px 35px #183a581b;border:1px solid #ffffffb8;border-radius:22px;color:var(--hu-ink)}
.hu-picture{display:none;object-fit:contain;width:min(92%,720px);max-height:27vh;margin:8px auto 14px;border-radius:16px;box-shadow:0 6px 24px #1234}
.hu-picture.is-visible{display:block}
.hu-time-low{background:#d88b3b!important}.hu-time-critical{background:#c65a53!important}

.screen{background-image:linear-gradient(180deg,#edf4f5c9,#edf4f5ad),var(--hu-scene,url('images/nuclear_dome_01.png'));background-position:center;background-size:cover;min-height:100dvh}
#quizScreen{--hu-scene:url('images/nuclear_dome_01.png');background-image:linear-gradient(180deg,#e6f0f0a3,#e8f1f1ad),var(--hu-scene);background-size:cover;background-position:center;min-height:100dvh;padding:clamp(12px,3.2vw,24px)}
#quizScreen .question{background:#fffffff0;box-shadow:0 10px 32px #183a5818;border-radius:20px;max-width:650px;margin:14px auto 16px;padding:24px 16px;font-size:clamp(21px,5.8vw,30px);line-height:1.38}
#quizScreen .timer-wrap{background:#ffffffe0;border-radius:15px;padding:12px 15px;margin-top:10px;box-shadow:0 4px 16px #183a5810}
#quizScreen .timer-value{font-size:27px;color:var(--hu-navy)}#quizScreen .timer-bar{background:#448caa}
#quizScreen .answer{min-height:clamp(108px,21vh,175px);font-size:clamp(16px,4.4vw,23px);padding:14px 10px;line-height:1.35;box-shadow:0 7px 18px #183a581d;overflow-wrap:anywhere}
#quizScreen .answers.long-answers{grid-template-columns:1fr}#quizScreen .answers.long-answers .answer{min-height:65px;text-align:left;padding:15px 18px}
.color1{background:#3b8bb5}.color2{background:#349b82}.color3{background:#d39452}.color4{background:#8277b8}
.card{background:#fffffff0;box-shadow:0 15px 40px #183a5820}.main-button,.submit-button{background:var(--hu-navy)}
#joinScreen h1{color:#173e5b}
@media(min-width:720px){#quizScreen{max-width:100%;margin:0 auto}#quizScreen .answers,#quizScreen .question,#quizScreen .timer-wrap{max-width:550px}}
@media(max-width:380px){#quizScreen .answer{min-height:100px}}


/* 교육생 휴대전화 세로 화면 최적화 */
@media(max-width:700px){
  html,body{width:100%;overflow-x:hidden}
  .screen{padding:16px;min-height:100dvh}
  #quizScreen{padding:12px 12px 22px}
  #quizScreen .timer-wrap{margin:6px auto 10px;padding:9px 12px}
  #quizScreen .timer-value{font-size:24px}
  #quizScreen .question{margin:10px auto 12px;padding:18px 13px;font-size:clamp(20px,5.5vw,27px)}
  #quizScreen .answers{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  #quizScreen .answer{min-height:clamp(96px,16dvh,145px);font-size:clamp(16px,4.2vw,21px);padding:12px 8px}
  #quizScreen .answers.long-answers{grid-template-columns:1fr}
  #quizScreen .answers.long-answers .answer{min-height:62px}
  .hu-picture{max-height:22dvh}
  .card{padding:28px 18px}
  .order-info{margin:10px auto;padding:12px}
  #orderDisplay{font-size:19px}
}
@media(max-width:350px){
  #quizScreen .answers{gap:7px}
  #quizScreen .answer{min-height:88px;font-size:15px}
}

/* HU Quiz 2026 - 교육생 입장·대기·문제 디자인 */
#joinScreen,#waitingScreen{background-image:linear-gradient(145deg,rgba(12,47,76,.76),rgba(24,89,120,.35)),url('images/main.png');background-size:cover;background-position:center;min-height:100dvh;padding:24px 18px}
#joinScreen{align-items:center;justify-content:center}
#joinScreen .hu-join-mark{font-size:clamp(24px,6vw,34px);font-weight:900;letter-spacing:2px;color:#fff;margin-bottom:15px}
#joinScreen .hu-join-mark span{color:#8dd6f1}
#joinScreen h1{color:white;font-size:clamp(32px,8vw,46px);text-shadow:0 2px 12px #1239}
#joinScreen .subtitle{color:#e6f4fc;margin:12px 0 28px;font-size:16px}
#joinScreen #nickname{max-width:430px;background:#ffffffed;border:2px solid #ffffffbd;box-shadow:0 8px 25px #1234;text-align:center;outline:none}
#joinScreen #nickname:focus{border-color:#52b7e7}
#joinScreen .main-button{max-width:430px;background:#0b77b5;box-shadow:0 10px 28px #1235;border-radius:14px}
#waitingScreen .hu-wait-card{max-width:440px;background:#fffffff4;border:1px solid #ffffffad;box-shadow:0 20px 50px #081e3966;padding:36px 24px;border-radius:27px}
.hu-wait-icon{width:74px;height:74px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;background:#dff5e9;color:#20865d;font-size:41px;font-weight:900}
.hu-wait-kicker{font-size:14px;font-weight:800;color:#168563;letter-spacing:2px;margin-bottom:10px}
#waitingScreen .big-name{font-size:clamp(26px,7vw,36px);color:#153c5b;margin-bottom:16px;overflow-wrap:anywhere}
#waitingScreen .message{font-size:17px;color:#526a7c;line-height:1.8}
.hu-wait-dots{display:flex;justify-content:center;gap:8px;margin:24px 0 14px}
.hu-wait-dots i{width:9px;height:9px;border-radius:50%;background:#288ebc;animation:huPulse 1.35s infinite ease-in-out}
.hu-wait-dots i:nth-child(2){animation-delay:.18s}.hu-wait-dots i:nth-child(3){animation-delay:.36s}
@keyframes huPulse{0%,70%,100%{opacity:.25;transform:scale(.85)}35%{opacity:1;transform:scale(1.2)}}
.hu-wait-foot{font-size:13px;color:#7e94a4}
#quizScreen{display:none;max-width:none}
#quizScreen .question-number{max-width:660px;margin:5px auto 9px;font-weight:800;text-align:left;color:#285b78}
#quizScreen .timer-wrap{max-width:650px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 auto 10px!important;padding:9px 15px!important;border-radius:19px!important}
#quizScreen .hu-timer-copy{display:flex;flex-direction:column;gap:4px;align-items:flex-start;font-size:16px;color:#284e69}
#quizScreen .hu-timer-copy span{font-size:12px;color:#748c9c}
.hu-clock{--clock-progress:100%;width:86px;height:86px;border-radius:50%;background:conic-gradient(#207ca9 var(--clock-progress),#dfe9ee 0);padding:7px;display:grid;place-items:center;flex:none}
.hu-clock-inner{width:100%;height:100%;border-radius:50%;background:white;display:grid;place-items:center}
#quizScreen .hu-clock .timer-value{font-size:20px!important;color:#123d60;font-weight:900;white-space:nowrap}
.hu-clock.low{background:conic-gradient(#df9b3e var(--clock-progress),#f0e7db 0)}
.hu-clock.critical{background:conic-gradient(#d65353 var(--clock-progress),#f2dddd 0)}
#quizScreen .timer-bar-bg{display:none}
#quizScreen .question{font-size:clamp(22px,5.6vw,30px);border-radius:21px;padding:22px 16px;margin:9px auto 14px;box-shadow:0 8px 28px #123d601b}
#quizScreen .answer{border-radius:18px;box-shadow:0 7px 20px #123d6027;min-height:clamp(110px,20dvh,170px)}
#quizScreen.hu-warmup .question-number::before{content:'🎈 몸풀기 게임  ·  ';color:#a96b2d}
#quizScreen.hu-warmup .question{background:#fff9e9;border:2px solid #e8c68d}
#quizScreen.hu-warmup .answer{filter:saturate(.8);border:3px solid #ffffffa8}
@media(max-width:700px){#quizScreen .timer-wrap{padding:8px 13px!important}#quizScreen .hu-clock{width:76px;height:76px;padding:6px}#quizScreen .hu-clock .timer-value{font-size:18px!important}#quizScreen .answer{min-height:clamp(104px,17dvh,145px)}}
@media(prefers-reduced-motion:reduce){.hu-wait-dots i{animation:none}}


/* HU Quiz: responsive stage layout */
#prepareScreen{position:fixed;inset:0;z-index:900;background:radial-gradient(circle at 50% 30%,#fff,#dcecff);display:none;align-items:center;justify-content:center;flex-direction:column;color:#174775;text-align:center;padding:24px}
#prepareScreen h2{font-size:clamp(26px,4vw,50px)}#prepareCount{font-size:clamp(100px,18vw,190px);font-weight:900;color:#2485dc}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;min-height:250px}.podium-place{display:flex;flex-direction:column;justify-content:center;gap:12px;width:30%;background:#cce7ff;border-radius:22px 22px 0 0;padding:20px 8px;overflow-wrap:anywhere}.podium-place b{font-size:45px}.podium-place strong{font-size:clamp(18px,3vw,32px)}.place1{min-height:220px;background:#ffe5a0}.place2{min-height:180px}.place3{min-height:150px;background:#f3d5bf}.rank-row{padding:12px;border-bottom:1px solid #dce7f0;text-align:left}.correct-choice{background:#dcfce7!important;border:4px solid #16a34a!important;color:#14532d!important}.wrong-choice{border:4px solid #e34e55!important;opacity:.75}.hu-picture.is-visible{object-fit:contain!important;width:100%;max-height:32vh;background:#ffffffb0;border-radius:18px}.result-note{background:#fffffff0;padding:16px;border-radius:16px;margin-top:12px;line-height:1.5;color:#183b56}
#rehearsalBar{position:fixed;bottom:0;left:0;right:0;z-index:950;background:#173d60;color:white;padding:8px;display:flex;gap:8px;align-items:center;justify-content:center}#rehearsalBar button{padding:8px;font-size:14px}#mobilePreview{position:fixed;right:12px;top:80px;width:360px;height:75vh;z-index:940;background:white;border:7px solid #173d60;border-radius:24px;display:none}

#quizScreen{box-sizing:border-box;min-height:100dvh;padding:18px 16px 24px!important;background:linear-gradient(#ffffff30,#ffffff10),var(--hu-scene) center/contain no-repeat #dce8eb!important;position:relative}#quizScreen .question-number{margin:0 90px 12px 0;text-align:left;font-weight:800;color:#143953}#quizScreen .timer-wrap{position:absolute;right:12px;top:8px;padding:0!important;background:transparent!important;width:auto;box-shadow:none}#quizScreen .hu-clock{width:64px;height:64px}#quizScreen .question{margin:20px 0 14px!important;padding:16px!important;font-size:clamp(20px,5.3vw,28px);background:#ffffffe6!important;text-align:left}#quizScreen .answers,#quizScreen .answers.long-answers{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px;margin-top:16px}#quizScreen .answer,#quizScreen .answers.long-answers .answer{min-height:90px!important;font-size:clamp(16px,4.5vw,23px);padding:12px!important;text-align:center;border:3px solid #fff;overflow-wrap:anywhere}#quizScreen.warmup-scene .answers{position:absolute;bottom:24px;left:16px;right:16px}#quizScreen.warmup-scene .question{margin-top:35px!important}#quizScreen.warmup-scene .answer{min-height:65px!important;background:#fffffff0;color:#174775}#quizScreen[data-type="ox"] .answer{font-size:64px!important}#quizScreen[data-type="ox"] .answer:first-child{background:#2187dd}#quizScreen[data-type="ox"] .answer:nth-child(2){background:#e85260}#quizScreen.warmup-scene:has(.result-note) .answers{bottom:120px}#quizScreen.warmup-scene .result-note{position:absolute;bottom:12px;left:16px;right:16px;font-size:14px}.card{width:min(92vw,560px);box-sizing:border-box}#rankingScreen{background:linear-gradient(#e0f1ff,#f8fbff)}
</style>
</head>


<body>

<!-- 입장 -->
<div id="joinScreen" class="screen">

  <div class="hu-join-mark">HU <span>QUIZ</span></div>
  <h1>함께하는 퀴즈</h1>
  <div class="subtitle">닉네임을 입력하고 교육에 참여하세요</div>

  <input
    id="nickname"
    type="text"
    maxlength="10"
    placeholder="닉네임을 입력하세요">

  <button
    class="main-button"
    onclick="joinQuiz()">
    입장하기
  </button>

</div>


<!-- 대기 -->
<div id="waitingScreen" class="screen">
  <div class="card hu-wait-card">
    <div class="hu-wait-icon" aria-hidden="true">✓</div>
    <div class="hu-wait-kicker">입장 완료</div>
    <div id="waitingName" class="big-name"></div>
    <div class="message">퀴즈에 참여할 준비가 끝났어요!<br>강사가 시작하면 문제가 자동으로 나타납니다.</div>
    <div class="hu-wait-dots" aria-label="대기 중"><i></i><i></i><i></i></div>
    <div class="hu-wait-foot">화면을 닫지 말고 잠시 기다려 주세요</div>
  </div>
</div>

<!-- 문제 -->
<div id="quizScreen">

  <div
    id="questionNumber"
    class="question-number">
  </div>

  <div id="timerWrap" class="timer-wrap">
    <div class="hu-timer-copy"><strong>남은 시간</strong><span>정답을 선택하세요</span></div>
    <div class="hu-clock" id="studentClock"><div class="hu-clock-inner"><span id="timerValue" class="timer-value">--</span></div></div>
    <div class="timer-bar-bg" aria-hidden="true"><div id="timerBar" class="timer-bar"></div></div>
  </div>

  <div id="timeOverMessage" class="time-over">
    ⏰ 제한시간이 종료되었습니다.
  </div>



  <div
    id="questionText"
    class="question">
  </div>

  <img id="studentPicture" class="hu-picture" alt="문제 이미지">
  <div
    id="answers"
    class="answers">
  </div>


  <div
    id="orderInfo"
    class="order-info">

    <div class="order-title">
      내가 선택한 순서
    </div>

    <div id="orderDisplay">
      아직 선택하지 않았습니다.
    </div>

  </div>


  <div
    id="orderControls"
    class="order-controls">

    <button
      class="small-button reset-button"
      onclick="resetOrder()">
      마지막 선택 취소
    </button>

    <button
      class="small-button submit-button"
      onclick="submitOrder()">
      답변 제출
    </button>

  </div>

</div>


<!-- 제출 완료 -->
<div id="submittedScreen" class="screen">

  <div class="card">

    <div class="result-symbol">✓</div>

    <div class="result-title">
      답변 제출 완료
    </div>

    <div class="message">
      답변이 제출되었습니다.<br>
      <span id="submittedWaitText">강사의 정답 공개를 기다려 주세요.</span>
    </div>

  </div>

</div>


<!-- 정답 결과 -->
<div id="resultScreen" class="screen">

  <div class="card">

    <div
      id="resultSymbol"
      class="result-symbol">
    </div>

    <div
      id="resultTitle"
      class="result-title">
    </div>

    <div
      id="myAnswer"
      class="my-answer">
    </div>

    <div
      id="correctAnswer"
      class="correct-answer">
    </div>

    <div
      id="explanation"
      class="explanation">
    </div>

    <br>

    <div class="message">
      다음 문제를 기다려 주세요.
    </div>

  </div>

</div>


<section id="rankingScreen" class="screen"><div class="card"><h2>🏆 누적 순위</h2><div id="studentRanking"></div></div></section>
<!-- 종료 -->
<div id="finishedScreen" class="screen">

  <div class="card">

    <div class="result-symbol">🏁</div>

    <div class="result-title">
      퀴즈가 종료되었습니다.
    </div>

    <div class="message">
      참여해 주셔서 감사합니다.<div id="finalRanking"></div>
    </div>

  </div>

</div>



<section id="prepareScreen"><div>HU QUIZ</div><h2>이제 곧 문제가 출제됩니다!</h2><div id="prepareCount">3</div></section><script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  set as firebase_set,
  onValue,
  serverTimestamp,
  get
}

function restoreAnswer(questionNumber) {
  const saved = sessionStorage.getItem("huQuizAnswer_" + participantId + "_" + questionNumber);

    myAnswer = JSON.parse(saved);

async function restoreParticipant() {
  const user = await authReady;
  if (!user || !user.isAnonymous) return;
  let saved;
  try { saved = JSON.parse(sessionStorage.getItem(participantStorageKey) || "null"); }
  catch (e) { return; }
  if (!saved || !saved.participantId || saved.ownerUid !== user.uid) return;
  try {
    const snap = await get(ref(database, "participants/" + saved.participantId));
    const record = snap.val();
    if (!record || record.ownerUid !== user.uid) {
      sessionStorage.removeItem(participantStorageKey);
      return;
    }
    participantId = saved.participantId;
    nickname = record.nickname;
    joined = true;
    if (latestQuizState?.resetAt && !sessionStorage.getItem(resetStorageKey)) {
      sessionStorage.setItem(resetStorageKey, String(latestQuizState.resetAt));
    }
    document.getElementById("waitingName").textContent = nickname + "님";
    applyQuizState(latestQuizState);
  } catch (error) {
    console.error("참가자 복원 실패:", error);
  }
}

window.joinQuiz = async function() {

  nickname =
    document.getElementById("nickname")
      .value.trim();


  if (Array.from(nickname).length > 10) {
    alert("닉네임은 최대 10자까지 입력할 수 있습니다.");
    return;
  }

  if (!nickname) {

    alert("닉네임을 입력해주세요.");

    return;

  }


  try {
    const studentUser = await authReady;
    if (!studentUser || studentUser.isAnonymous !== true) {
      alert("교육생 인증에 실패했습니다. 페이지를 새로고침한 뒤 다시 시도해주세요.");
      return;
    }

    const existing=(await get(ref(database,"participants"))).val()||{};
    if(Object.keys(existing).length>=25)throw Error("참가자는 최대 25명입니다.");
    if(Object.values(existing).some(p=>p.nickname===nickname))throw Error("이미 사용 중인 닉네임입니다.");
    // Firebase에 참가자 등록
    const newParticipantRef =
      push(
        ref(database, "participants")
      );


    participantId =
      newParticipantRef.key;


    await set(
      newParticipantRef,
      {
        nickname: nickname,
        ownerUid: studentUser.uid,
        joinedAt: serverTimestamp()
      }
    );


    joined = true;
    if (latestQuizState?.resetAt) sessionStorage.setItem(resetStorageKey, String(latestQuizState.resetAt));
    storeParticipant();


    document.getElementById("waitingName")
      .textContent =
      nickname + "님";


    showScreen("waitingScreen");
    applyQuizState(latestQuizState);


  } catch(error) {

    alert(error.message||"입장에 실패했습니다. 다시 시도해주세요.");

    console.error(error);

  }

};

function stopTimer() {

  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }

}


function lockAnswerInput() {

  document.querySelectorAll(".answer")
    .forEach(btn => {
      btn.disabled = true;
    });

  const submitButton =
    document.querySelector(".submit-button");

  const resetButton =
    document.querySelector(".reset-button");

  if (submitButton) {
    submitButton.disabled = true;
  }

  if (resetButton) {
    resetButton.disabled = true;
  }

}


function expireQuestion() {

  if (timeExpired) return;

  timeExpired = true;

  stopTimer();

  document.getElementById("timerValue")
    .textContent = "0.0초";

  document.getElementById("timerBar")
    .style.width = "0%";

  document.getElementById("timeOverMessage")
    .style.display = "block";

  if (
    submittedQuestion !==
    currentQuestion
  ) {
    lockAnswerInput();
  }

}


function startTimer(startedAt, durationSec) {

  stopTimer();

  questionStartedAt =
    Number(startedAt);

  questionDurationSec =
    Number(durationSec) || 10;

  timeExpired = false;

  document.getElementById("timeOverMessage")
    .style.display = "none";

  const submitButton =
    document.querySelector(".submit-button");

  const resetButton =
    document.querySelector(".reset-button");

  if (submitButton) {
    submitButton.disabled = false;
  }

  if (resetButton) {
    resetButton.disabled = false;
  }


  const update = () => {

    if (!questionStartedAt) {
      return;
    }

    const elapsedMs =
      serverNow() - questionStartedAt;

    const totalMs =
      questionDurationSec * 1000;

    const remainingMs =
      Math.max(0, totalMs - elapsedMs);

    const remainingSec =
      remainingMs / 1000;
    huTimerColors(remainingSec);
     document.getElementById("studentClock")?.style.setProperty("--clock-progress",String(Math.max(0,Math.min(100,remainingMs/totalMs*100)))+"%");

    document.getElementById("timerValue")
      .textContent =
      remainingSec.toFixed(1) + "초";

    const percent =
      Math.max(
        0,
        Math.min(
          100,
          (remainingMs / totalMs) * 100
        )
      );

    document.getElementById("timerBar")
      .style.width =
      percent + "%";


    if (remainingMs <= 0) {
      expireQuestion();
    }

  };


  update();

  timerInterval =
    setInterval(update, 100);

}

async function submitChoice(
  button,
  answer
) {

  if (
    submittedQuestion ===
    currentQuestion ||
    timeExpired
  ) return;


  document.querySelectorAll(".answer")
    .forEach(btn => {

      btn.disabled = true;

    });


  button.classList.add("selected");


  myAnswer = answer;


  await saveAnswer(answer);

function selectMulti(button,option){
 if(submittedQuestion===currentQuestion||timeExpired)return;
 if(orderSelection.includes(option)){orderSelection=orderSelection.filter(v=>v!==option);button.classList.remove("used");}
 else{orderSelection.push(option);button.classList.add("used");}
 updateOrderDisplay();
}
function selectOrder(
  button,
  option
) {

  if (
    submittedQuestion ===
    currentQuestion ||
    timeExpired || answerSaving
  ) return;


  if (
    orderSelection.includes(option)
  ) return;


  orderSelection.push(option);


  button.classList.add("used");

  button.disabled = true;


  button.textContent = (orderSelection.length) + "번째 ✓ " + option;
  updateOrderDisplay();
  if(orderSelection.length === questions[currentQuestion].options.length){
    submitOrder();
  }
}



function updateOrderDisplay() {

  const display =
    document.getElementById("orderDisplay");


  if (orderSelection.length === 0) {

    display.textContent =
      "아직 선택하지 않았습니다.";

  } else {

    display.textContent =
      orderSelection.map(v => (questions[currentQuestion]?.options.indexOf(v) ?? -1) + 1).join(" → ");

  }

}



window.resetOrder = function() {

  if (
    submittedQuestion ===
    currentQuestion ||
    timeExpired
  ) return;


  if(questions[currentQuestion]?.type === "order"){
    const removed=orderSelection.pop();
    if(removed===undefined)return;
    const idx=questions[currentQuestion].options.indexOf(removed);
    const btn=document.querySelectorAll(".answer")[idx];
    if(btn){btn.disabled=false;btn.classList.remove("used");btn.textContent=(idx+1)+". "+removed;}
  }else{
    orderSelection=[];
    document.querySelectorAll(".answer").forEach((btn,i)=>{btn.disabled=false;btn.classList.remove("used");});
  }
  updateOrderDisplay();

};



window.submitOrder = async function() {

  if(serverNow()>=Number(latestQuizState?.startedAt)+Number(latestQuizState?.durationSec)*1000){expireQuestion();return;}
  if (timeExpired || answerSaving || submittedQuestion === currentQuestion) {
    return;
  }

  const q =
    questions[currentQuestion];


  if (
    (q.type === "multi" ? orderSelection.length === 0 : orderSelection.length !== q.options.length)
  ) {

    alert(
      "모든 항목을 순서대로 선택해주세요."
    );

    return;

  }


  myAnswer =
    q.type === "multi" ? [...orderSelection].sort() : [...orderSelection];


  document.querySelectorAll(".answer")
    .forEach(btn => {

      btn.disabled = true;

    });


  await saveAnswer(myAnswer);

};

async function saveAnswer(answer) {

  if(serverNow()>=Number(latestQuizState?.startedAt)+Number(latestQuizState?.durationSec)*1000){expireQuestion();return;}
  if (timeExpired || answerSaving || submittedQuestion === currentQuestion) {
    return;
  }

  if(rehearsal){myAnswer=answer;submittedQuestion=currentQuestion;previewChannel.postMessage({kind:"answer",answer:{answer}});showScreen("submittedScreen");return;}
  answerSaving = true;
  const savingQuestion = currentQuestion;

  // 문제 번호 + 참가자 ID를 고정 키로 사용해 중복 답변을 구분합니다.
  // 서버 보안규칙에서 기존 키의 덮어쓰기를 금지해야 최종적으로 보호됩니다.
  const answerRef = ref(database, "answers/" + currentQuestion + "_" + participantId);

  try {

    await set(
      answerRef,
      {

        participantId:
          participantId,
        ownerUid: auth.currentUser?.uid || "",

        nickname:
          nickname,

        question:
          currentQuestion,

        answer:
          answer,

        submittedAt:
          serverTimestamp()

      }
    );


    rememberAnswer(savingQuestion, answer);
    submittedQuestion = savingQuestion;
    stopTimer();


    showScreen(
      "submittedScreen"
    );


  } catch(error) {

    alert(
      "답변 전송에 실패했습니다."
    );

    console.error(error);
    if (!timeExpired && currentQuestion === savingQuestion) {
      document.querySelectorAll(".answer").forEach(btn => { btn.disabled = false; });
      const submitButton = document.querySelector(".submit-button");
      if (submitButton) submitButton.disabled = false;
    }
  } finally {
    answerSaving = false;
  }

}

function showResult(){stopTimer();const answer=myAnswer??(restoreAnswer(currentQuestion)?myAnswer:null);const q=questions[currentQuestion];displayQuestion(currentQuestion,latestQuizState);stopTimer();myAnswer=answer;showScreen('quizScreen');document.querySelectorAll('#answers .answer').forEach((btn,i)=>{btn.disabled=true;const option=q.options[i],correct=q.type!=='poll'&&(Array.isArray(q.correct)?q.correct.includes(option):q.correct===option);if(correct)btn.classList.add('correct-choice');const picked=Array.isArray(answer)?answer.includes(option):answer===option;if(picked&&!correct&&q.type!=='poll')btn.classList.add('wrong-choice');if(q.type==='poll'){const n=latestQuizState?.distribution?.[i]||0;const total=latestQuizState?.responseTotal||0;btn.textContent=option+' · '+n+'명 ('+(total?Math.round(n/total*100):0)+'%)';}if(q.type==='order')btn.textContent=(q.correct.indexOf(option)+1)+'번째 · '+option;});document.getElementById('orderControls').style.display='none';document.getElementById('timerWrap').style.visibility='hidden';let note=document.getElementById('answerExplanation');if(!note){note=document.createElement('div');note.id='answerExplanation';note.className='result-note';document.getElementById('quizScreen').append(note);}note.textContent=q.type==='poll'?'투표 결과입니다. 다음 문제를 기다려 주세요.':q.explanation||'초록색 선택지가 정답입니다.';}

function applyQuizState(state) {
  if (state && Array.isArray(state.questions) && state.questions.length) questions = state.questions;
  if (!joined) return;
  if (!state) {
    stopTimer();
    showScreen("waitingScreen");
    return;
  }

  hidePreparation();
  if(state.status==="preparing"){stopTimer();showScreen("waitingScreen");preparation(state.prepareUntil);return;}
  if(state.status==="ranking"){stopTimer();showScreen("rankingScreen");document.getElementById("studentRanking").innerHTML=podium(state.ranking||[]);return;}
  if (state.status === "question") {
    const newQuestion = Number(state.question);
    if (!Number.isInteger(newQuestion) || newQuestion < 0 || newQuestion >= questions.length) return;
    if (newQuestion !== currentQuestion) {
      displayQuestion(newQuestion, state);
    } else if (submittedQuestion === currentQuestion) {
      stopTimer();
      showScreen("submittedScreen");
    } else if (!timerInterval && !timeExpired) {
      startTimer(state.startedAt, state.durationSec || 10);
    }
    return;
  }

  if (state.status === "result") {
    const newQuestion = Number(state.question);
    if (!Number.isInteger(newQuestion) || newQuestion < 0 || newQuestion >= questions.length) return;
    if (currentQuestion !== newQuestion) {
      currentQuestion = newQuestion;
      submittedQuestion = -1;
      myAnswer = null;
      restoreAnswer(newQuestion);
    }
    showResult();
    return;
  }

  if (state.status === "waiting") {
    // 강사가 새 퀴즈를 준비했다면 기존 참가자 세션을 폐기하고 재입장 유도
    if (state.resetAt && String(state.resetAt) !== sessionStorage.getItem(resetStorageKey)) {
      sessionStorage.setItem(resetStorageKey, String(state.resetAt));
      sessionStorage.removeItem(participantStorageKey);
      if (participantId) {
        for (let i = 0; i < questions.length; i++) {
          sessionStorage.removeItem("huQuizAnswer_" + participantId + "_" + i);
        }
      }
      joined = false;
      participantId = "";
      nickname = "";
      currentQuestion = -1;
      submittedQuestion = -1;
      myAnswer = null;
      stopTimer();
      showScreen("joinScreen");
      return;
    }
    stopTimer();
    currentQuestion = -1;
    submittedQuestion = -1;
    myAnswer = null;
    showScreen("waitingScreen");
    return;
  }

  if (state.status === "finished") {
    stopTimer();
    showScreen("finishedScreen");
    document.getElementById("finalRanking").innerHTML=podium(state.ranking||[]);
  }
}

if(!rehearsal) authReady.then(user=>{if(user)onValue(ref(database, "quizState"), snapshot => {
  latestQuizState = snapshot.val();
  applyQuizState(latestQuizState);
}, error => console.error("진행상태 수신 실패:", error));});

if(!rehearsal) restoreParticipant();


const previewChannel=new BroadcastChannel('hu-quiz-rehearsal');
if(rehearsal){joined=true;nickname='미리보기';participantId='preview';showScreen('waitingScreen');document.getElementById('waitingName').textContent='교육생 화면 미리보기';previewChannel.onmessage=e=>{if(e.data.kind==='state'){latestQuizState=e.data.state;applyQuizState(latestQuizState);}};previewChannel.postMessage({kind:'ready'});}
</script>
