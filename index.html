<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HU Quiz</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, "Noto Sans KR", sans-serif;
  background: #f4f6f9;
  color: #222;
}

.screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 24px;
  text-align: center;
}

#waitingScreen,
#quizScreen,
#submittedScreen,
#resultScreen,
#finishedScreen {
  display: none;
}

h1 {
  font-size: 42px;
  margin: 0 0 8px;
}

.subtitle {
  color: #666;
  margin-bottom: 35px;
}

input {
  width: 100%;
  max-width: 420px;
  margin: 0 auto 15px;
  padding: 18px;
  font-size: 20px;
  border: 1px solid #ccc;
  border-radius: 12px;
}

.main-button {
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
  padding: 18px;
  border: none;
  border-radius: 12px;
  background: #222;
  color: white;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}

.card {
  width: 100%;
  max-width: 520px;
  margin: auto;
  padding: 35px 22px;
  background: white;
  border-radius: 20px;
}

.big-name {
  font-size: 27px;
  font-weight: bold;
  margin-bottom: 20px;
}

.message {
  color: #666;
  font-size: 19px;
  line-height: 1.6;
}


/* 문제 화면 */

#quizScreen {
  min-height: 100vh;
  padding: 20px;
}

.question-number {
  text-align: center;
  color: #777;
  font-size: 17px;
  margin-top: 8px;
}

.question {
  text-align: center;
  font-size: 27px;
  font-weight: bold;
  padding: 18px 5px 25px;
}

.answers {
  max-width: 650px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.answer {
  min-height: 125px;
  padding: 18px 10px;
  border: none;
  border-radius: 16px;
  color: white;
  font-size: 23px;
  font-weight: bold;
  cursor: pointer;
}

.color1 { background: #e74c3c; }
.color2 { background: #3498db; }
.color3 { background: #f39c12; }
.color4 { background: #27ae60; }

.answer.selected {
  outline: 7px solid #222;
  outline-offset: -7px;
}

.answer.used {
  opacity: 0.45;
}

.answer:disabled {
  cursor: default;
}


/* 순서 문제 */

.order-info {
  display: none;
  max-width: 650px;
  margin: 18px auto;
  padding: 16px;
  background: white;
  border-radius: 12px;
  text-align: center;
}

.order-title {
  color: #666;
  margin-bottom: 8px;
}

#orderDisplay {
  font-size: 24px;
  font-weight: bold;
  min-height: 30px;
}

.order-controls {
  display: none;
  max-width: 650px;
  margin: 15px auto;
  text-align: center;
}

.small-button {
  padding: 14px 22px;
  margin: 5px;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.reset-button {
  background: #ddd;
}

.submit-button {
  background: #222;
  color: white;
}


/* 제한시간 */
.timer-wrap {
  max-width: 650px;
  margin: 0 auto 18px;
  text-align: center;
}

.timer-label {
  font-size: 15px;
  color: #777;
  margin-bottom: 6px;
}

.timer-value {
  font-size: 34px;
  font-weight: bold;
}

.timer-bar-bg {
  width: 100%;
  height: 10px;
  margin-top: 8px;
  background: #ddd;
  border-radius: 999px;
  overflow: hidden;
}

.timer-bar {
  height: 100%;
  width: 100%;
  background: #222;
  transition: width 0.1s linear;
}

.time-over {
  margin: 16px auto 0;
  max-width: 650px;
  padding: 14px;
  border-radius: 12px;
  background: #fff3cd;
  color: #6b5700;
  font-weight: bold;
  display: none;
}


/* 결과 */

.result-symbol {
  font-size: 65px;
  margin-bottom: 10px;
}

.result-title {
  font-size: 29px;
  font-weight: bold;
  margin-bottom: 15px;
}

.my-answer {
  font-size: 19px;
  margin: 18px 0;
}

.correct-answer {
  font-size: 20px;
  font-weight: bold;
  margin: 18px 0;
}

.explanation {
  color: #555;
  line-height: 1.6;
  margin-top: 20px;
}

/* HU Quiz A형 - 차분한 원전/인적행위 배경과 반응형 디자인 */
:root{--hu-navy:#183a58;--hu-blue:#397b9c;--hu-ink:#17354c;--hu-soft:#edf3f5;--hu-card:rgba(255,255,255,.94)}
body{font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--hu-ink);background:#edf2f3}
button,input,select,textarea{font-family:inherit}
button{transition:filter .15s,transform .15s}button:active{transform:scale(.985)}
.hu-scene{background-image:linear-gradient(180deg,rgba(232,242,245,.24),rgba(222,235,234,.3)),var(--hu-scene);background-position:center;background-size:cover;background-attachment:fixed}
.hu-question-card{background:var(--hu-card)!important;box-shadow:0 12px 35px #183a581b;border:1px solid #ffffffb8;border-radius:22px;color:var(--hu-ink)}
.hu-picture{display:none;object-fit:contain;width:min(92%,720px);max-height:27vh;margin:8px auto 14px;border-radius:16px;box-shadow:0 6px 24px #1234}
.hu-picture.is-visible{display:block}
.hu-time-low{background:#d88b3b!important}.hu-time-critical{background:#c65a53!important}

.screen{background-image:linear-gradient(180deg,#edf4f5c9,#edf4f5ad),var(--hu-scene,url('images/nuclear_dome_01.png'));background-position:center;background-size:cover;min-height:100dvh}
#quizScreen{--hu-scene:url('images/nuclear_dome_01.png');background-image:linear-gradient(180deg,#e6f0f0a3,#e8f1f1ad),var(--hu-scene);background-size:cover;background-position:center;min-height:100dvh;padding:clamp(12px,3.2vw,24px)}
#quizScreen .question{background:#fffffff0;box-shadow:0 10px 32px #183a5818;border-radius:20px;max-width:650px;margin:14px auto 16px;padding:24px 16px;font-size:clamp(21px,5.8vw,30px);line-height:1.38}
#quizScreen .timer-wrap{background:#ffffffe0;border-radius:15px;padding:12px 15px;margin-top:10px;box-shadow:0 4px 16px #183a5810}
#quizScreen .timer-value{font-size:27px;color:var(--hu-navy)}#quizScreen .timer-bar{background:#448caa}
#quizScreen .answer{min-height:clamp(108px,21vh,175px);font-size:clamp(16px,4.4vw,23px);padding:14px 10px;line-height:1.35;box-shadow:0 7px 18px #183a581d;overflow-wrap:anywhere}
#quizScreen .answers.long-answers{grid-template-columns:1fr}#quizScreen .answers.long-answers .answer{min-height:65px;text-align:left;padding:15px 18px}
.color1{background:#3b8bb5}.color2{background:#349b82}.color3{background:#d39452}.color4{background:#8277b8}
.card{background:#fffffff0;box-shadow:0 15px 40px #183a5820}.main-button,.submit-button{background:var(--hu-navy)}
#joinScreen h1{color:#173e5b}
@media(min-width:720px){#quizScreen{max-width:100%;margin:0 auto}#quizScreen .answers,#quizScreen .question,#quizScreen .timer-wrap{max-width:550px}}
@media(max-width:380px){#quizScreen .answer{min-height:100px}}


/* 교육생 휴대전화 세로 화면 최적화 */
@media(max-width:700px){
  html,body{width:100%;overflow-x:hidden}
  .screen{padding:16px;min-height:100dvh}
  #quizScreen{padding:12px 12px 22px}
  #quizScreen .timer-wrap{margin:6px auto 10px;padding:9px 12px}
  #quizScreen .timer-value{font-size:24px}
  #quizScreen .question{margin:10px auto 12px;padding:18px 13px;font-size:clamp(20px,5.5vw,27px)}
  #quizScreen .answers{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  #quizScreen .answer{min-height:clamp(96px,16dvh,145px);font-size:clamp(16px,4.2vw,21px);padding:12px 8px}
  #quizScreen .answers.long-answers{grid-template-columns:1fr}
  #quizScreen .answers.long-answers .answer{min-height:62px}
  .hu-picture{max-height:22dvh}
  .card{padding:28px 18px}
  .order-info{margin:10px auto;padding:12px}
  #orderDisplay{font-size:19px}
}
@media(max-width:350px){
  #quizScreen .answers{gap:7px}
  #quizScreen .answer{min-height:88px;font-size:15px}
}

/* HU Quiz 2026 - 교육생 입장·대기·문제 디자인 */
#joinScreen,#waitingScreen{background-image:linear-gradient(145deg,rgba(12,47,76,.76),rgba(24,89,120,.35)),url('images/main.png');background-size:cover;background-position:center;min-height:100dvh;padding:24px 18px}
#joinScreen{align-items:center;justify-content:center}
#joinScreen .hu-join-mark{font-size:clamp(24px,6vw,34px);font-weight:900;letter-spacing:2px;color:#fff;margin-bottom:15px}
#joinScreen .hu-join-mark span{color:#8dd6f1}
#joinScreen h1{color:white;font-size:clamp(32px,8vw,46px);text-shadow:0 2px 12px #1239}
#joinScreen .subtitle{color:#e6f4fc;margin:12px 0 28px;font-size:16px}
#joinScreen #nickname{max-width:430px;background:#ffffffed;border:2px solid #ffffffbd;box-shadow:0 8px 25px #1234;text-align:center;outline:none}
#joinScreen #nickname:focus{border-color:#52b7e7}
#joinScreen .main-button{max-width:430px;background:#0b77b5;box-shadow:0 10px 28px #1235;border-radius:14px}
#waitingScreen .hu-wait-card{max-width:440px;background:#fffffff4;border:1px solid #ffffffad;box-shadow:0 20px 50px #081e3966;padding:36px 24px;border-radius:27px}
.hu-wait-icon{width:74px;height:74px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;background:#dff5e9;color:#20865d;font-size:41px;font-weight:900}
.hu-wait-kicker{font-size:14px;font-weight:800;color:#168563;letter-spacing:2px;margin-bottom:10px}
#waitingScreen .big-name{font-size:clamp(26px,7vw,36px);color:#153c5b;margin-bottom:16px;overflow-wrap:anywhere}
#waitingScreen .message{font-size:17px;color:#526a7c;line-height:1.8}
.hu-wait-dots{display:flex;justify-content:center;gap:8px;margin:24px 0 14px}
.hu-wait-dots i{width:9px;height:9px;border-radius:50%;background:#288ebc;animation:huPulse 1.35s infinite ease-in-out}
.hu-wait-dots i:nth-child(2){animation-delay:.18s}.hu-wait-dots i:nth-child(3){animation-delay:.36s}
@keyframes huPulse{0%,70%,100%{opacity:.25;transform:scale(.85)}35%{opacity:1;transform:scale(1.2)}}
.hu-wait-foot{font-size:13px;color:#7e94a4}
#quizScreen{display:none;max-width:none}
#quizScreen .question-number{max-width:660px;margin:5px auto 9px;font-weight:800;text-align:left;color:#285b78}
#quizScreen .timer-wrap{max-width:650px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 auto 10px!important;padding:9px 15px!important;border-radius:19px!important}
#quizScreen .hu-timer-copy{display:flex;flex-direction:column;gap:4px;align-items:flex-start;font-size:16px;color:#284e69}
#quizScreen .hu-timer-copy span{font-size:12px;color:#748c9c}
.hu-clock{--clock-progress:100%;width:86px;height:86px;border-radius:50%;background:conic-gradient(#207ca9 var(--clock-progress),#dfe9ee 0);padding:7px;display:grid;place-items:center;flex:none}
.hu-clock-inner{width:100%;height:100%;border-radius:50%;background:white;display:grid;place-items:center}
#quizScreen .hu-clock .timer-value{font-size:20px!important;color:#123d60;font-weight:900;white-space:nowrap}
.hu-clock.low{background:conic-gradient(#df9b3e var(--clock-progress),#f0e7db 0)}
.hu-clock.critical{background:conic-gradient(#d65353 var(--clock-progress),#f2dddd 0)}
#quizScreen .timer-bar-bg{display:none}
#quizScreen .question{font-size:clamp(22px,5.6vw,30px);border-radius:21px;padding:22px 16px;margin:9px auto 14px;box-shadow:0 8px 28px #123d601b}
#quizScreen .answer{border-radius:18px;box-shadow:0 7px 20px #123d6027;min-height:clamp(110px,20dvh,170px)}
#quizScreen.hu-warmup .question-number::before{content:'🎈 몸풀기 게임  ·  ';color:#a96b2d}
#quizScreen.hu-warmup .question{background:#fff9e9;border:2px solid #e8c68d}
#quizScreen.hu-warmup .answer{filter:saturate(.8);border:3px solid #ffffffa8}
@media(max-width:700px){#quizScreen .timer-wrap{padding:8px 13px!important}#quizScreen .hu-clock{width:76px;height:76px;padding:6px}#quizScreen .hu-clock .timer-value{font-size:18px!important}#quizScreen .answer{min-height:clamp(104px,17dvh,145px)}}
@media(prefers-reduced-motion:reduce){.hu-wait-dots i{animation:none}}


/* Limited update: preparation overlay and answer outlines only. */
#huPreparation[hidden]{display:none!important}
#huPreparation{position:fixed;inset:0;z-index:2000;background:#edf3f7;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;color:#183a58}
#huPreparation h2{font-size:clamp(25px,4vw,44px)}#huPrepareCount{font-size:clamp(50px,12vw,120px);font-weight:800}
body.quiz-presenting #options .option.correct-choice{outline:4px solid #219653;outline-offset:-4px;background:#e5f5eb!important;color:#14532d}
#resultChoices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0}
#resultChoices .result-choice{padding:14px 9px;border:2px solid #ccd9df;border-radius:12px;overflow-wrap:anywhere;background:#f4f7fa;color:#183a58}
#resultChoices .correct-choice{border:4px solid #219653;background:#e5f5eb;color:#14532d;font-weight:800}

/* Light, readable cards; preserve the existing screen structure. */
:root{--hu-ink:#17374d;--hu-navy:#185b83}
#quizScreen .question,#quizScreen.hu-warmup .question{background:rgba(255,255,255,.60)!important;border:1px solid rgba(255,255,255,.78);box-shadow:0 4px 16px #17374d0d;border-radius:18px;padding:19px 17px;line-height:1.45;color:#12354c;font-weight:750;text-shadow:0 1px 2px #ffffffa6}
#quizScreen .timer-wrap{background:rgba(255,255,255,.66)!important;box-shadow:none;border:1px solid #ffffff80;border-radius:16px!important}
#quizScreen .question-number{font-size:15px;font-weight:700;letter-spacing:.02em;color:#254c65}
#quizScreen .answers,#quizScreen .answers.long-answers{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px}
#quizScreen .answer,#quizScreen .answers.long-answers .answer{border-radius:17px;border:1px solid #ffffff8c;box-shadow:0 4px 12px #12354c18;padding:17px 12px;min-height:100px;font-size:clamp(16px,4.7vw,23px);line-height:1.4;text-align:center;overflow-wrap:anywhere;transition:transform .12s,box-shadow .12s}
#quizScreen .answer:active{transform:scale(.98)}#quizScreen .answer.used{outline:3px solid #12354c;outline-offset:2px}
.color1{background:#397eb0}.color2{background:#358e82}.color3{background:#b98246}.color4{background:#8071a6}
.card{border-radius:21px;box-shadow:0 8px 28px #12354c12;border:1px solid #ffffffa6}
#joinNotice{max-width:430px;padding:14px 18px;border-radius:14px;background:#ffffffeb;color:#184963;line-height:1.6;margin:0 0 16px;text-align:center}
#joinNotice:empty{display:none}.main-button:disabled{opacity:.55;cursor:default;box-shadow:none!important}
button:focus-visible{outline:3px solid #145e95;outline-offset:4px}

/* 2026-10-25: mobile layout and result background; no changes to scoring/Firebase */
#resultScreen{position:relative;isolation:isolate;background:#e9f0f1!important;overflow:hidden}
#resultScreen::before{content:"";position:absolute;inset:0;z-index:-1;background-image:var(--hu-result-scene,linear-gradient(#e9f0f1,#e9f0f1));background-position:center;background-size:cover;filter:none}
#resultScreen>.card{position:relative;background:rgba(255,255,255,.90)}
/* Keep the actual background photograph clear; do not place a pale overlay over it. */
#quizScreen{background-image:var(--hu-scene)!important}
/* Shared mobile layout: upper content, lower-half answer grid. */
@media(max-width:700px){
 #quizScreen[style*="display: grid"]{display:grid!important;box-sizing:border-box;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:54px auto minmax(0,1fr) minmax(0,1fr);height:100vh;height:100dvh;min-height:560px;padding:10px 12px max(12px,env(safe-area-inset-bottom));gap:10px;position:relative;align-content:stretch}
 #quizScreen #questionNumber{grid-column:1;grid-row:1;align-self:center;margin:0}
 #quizScreen #timerWrap{grid-column:2;grid-row:1;margin:0!important;padding:0!important;border:0!important;background:transparent!important;box-shadow:none!important}
 #quizScreen .hu-timer-copy{display:none}
 #quizScreen .hu-clock{width:53px;height:53px;padding:5px}
 #quizScreen .hu-clock .timer-value{font-size:13px!important}
 #quizScreen #questionText{grid-column:1/-1;grid-row:2;margin:0!important;padding:10px 12px!important;font-size:clamp(18px,5vw,25px);max-height:18dvh;overflow:auto}
 #quizScreen #studentPicture{grid-column:1/-1;grid-row:3;width:100%;height:100%;min-height:0;max-height:100%;object-fit:contain;margin:0;box-shadow:none;align-self:center}
 #quizScreen #answers{position:absolute;top:70%;bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;width:auto;height:auto;max-width:none;margin:0;display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-template-rows:repeat(var(--answer-rows,2),minmax(0,1fr));gap:8px;align-content:stretch}
 #quizScreen #answers .answer{position:static!important;box-sizing:border-box;width:100%;height:100%;min-width:0;min-height:0;margin:0;padding:12px;font-size:clamp(20px,5.6vw,30px);line-height:1.3;white-space:normal;overflow-wrap:anywhere;overflow:auto;border-radius:16px;touch-action:manipulation}
 #quizScreen #studentPicture{position:absolute;top:var(--photo-top,150px);left:12px;width:calc(100% - 24px);height:calc(70% - var(--photo-top,150px) - 14px)}
 #quizScreen #timeOverMessage{position:absolute;top:45%;left:12px;right:12px;z-index:3;margin:0}
 #quizScreen.hu-selection-controls #answers{bottom:120px}
 #quizScreen #orderInfo{position:absolute;bottom:62px;left:12px;right:12px;margin:0;padding:6px;max-height:48px;overflow:auto}
 #quizScreen #orderControls{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;margin:0}
}
/* Submitted screen follows the previous question scene */
#submittedScreen{background-image:var(--hu-scene)!important;background-position:center;background-size:cover}

/* 2026-10-25: 답안 영역 높이 확정 — 기존 top/bottom 충돌 방지 */
@media (max-width:700px){
  #quizScreen[style*="display: grid"]{min-height:0!important;height:100dvh!important;overflow:hidden}
  #quizScreen #answers{
    position:absolute!important;
    top:auto!important;
    bottom:max(12px,env(safe-area-inset-bottom))!important;
    height:calc(30dvh - max(12px,env(safe-area-inset-bottom)))!important;
    min-height:0!important;
    max-height:30dvh!important;
    align-content:stretch!important;
  }
  #quizScreen #answers .answer{min-height:0!important;height:100%!important}
  #quizScreen.hu-selection-controls #answers{
    bottom:120px!important;
    height:calc(30dvh - 120px)!important;
    max-height:30dvh!important;
  }
}
</style>
</head>


<body>

<!-- 입장 -->
<div id="joinScreen" class="screen">

  <div class="hu-join-mark">HU <span>QUIZ</span></div>
  <h1>함께하는 퀴즈</h1>
  <div class="subtitle">닉네임을 입력하고 교육에 참여하세요</div>

  <div id="joinNotice" role="status" aria-live="polite"></div>
  <input
    id="nickname"
    type="text"
    maxlength="10"
    placeholder="닉네임을 입력하세요">

  <button
    class="main-button"
    onclick="joinQuiz()">
    입장하기
  </button>

</div>


<!-- 대기 -->
<div id="waitingScreen" class="screen">
  <div class="card hu-wait-card">
    <div class="hu-wait-icon" aria-hidden="true">✓</div>
    <div class="hu-wait-kicker">입장 완료</div>
    <div id="waitingName" class="big-name"></div>
    <div class="message">퀴즈에 참여할 준비가 끝났어요!<br>강사가 시작하면 문제가 자동으로 나타납니다.</div>
    <div class="hu-wait-dots" aria-label="대기 중"><i></i><i></i><i></i></div>
    <div class="hu-wait-foot">화면을 닫지 말고 잠시 기다려 주세요</div>
  </div>
</div>

<!-- 문제 -->
<div id="quizScreen">

  <div
    id="questionNumber"
    class="question-number">
  </div>

  <div id="timerWrap" class="timer-wrap">
    <div class="hu-timer-copy"><strong>남은 시간</strong><span>정답을 선택하세요</span></div>
    <div class="hu-clock" id="studentClock"><div class="hu-clock-inner"><span id="timerValue" class="timer-value">--</span></div></div>

  </div>

function stopTimer() {

  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }

}


function lockAnswerInput() {

  document.querySelectorAll(".answer")
    .forEach(btn => {
      btn.disabled = true;
    });

  const submitButton =
    document.querySelector(".submit-button");

  const resetButton =
    document.querySelector(".reset-button");

  if (submitButton) {
    submitButton.disabled = true;
  }

  if (resetButton) {
    resetButton.disabled = true;
  }

}


function expireQuestion() {

  if (timeExpired) return;

  timeExpired = true;

  stopTimer();

  document.getElementById("timerValue")
    .textContent = "0.0초";

  document.getElementById("timerBar")
    .style.width = "0%";

  document.getElementById("timeOverMessage")
    .style.display = "block";

  if (
    submittedQuestion !==
    currentQuestion
  ) {
    lockAnswerInput();
  }

}


function startTimer(startedAt, durationSec) {

  stopTimer();

  questionStartedAt =
    Number(startedAt);

  questionDurationSec =
    Number(durationSec) || 10;

  timeExpired = false;

  document.getElementById("timeOverMessage")
    .style.display = "none";

  const submitButton =
    document.querySelector(".submit-button");

  const resetButton =
    document.querySelector(".reset-button");

  if (submitButton) {
    submitButton.disabled = false;
  }

  if (resetButton) {
    resetButton.disabled = false;
  }


  const update = () => {

    if (!questionStartedAt) {
      return;
    }

    const elapsedMs =
      serverNow() - questionStartedAt;

    const totalMs =
      questionDurationSec * 1000;

    const remainingMs =
      Math.max(0, totalMs - elapsedMs);

    const remainingSec =
      remainingMs / 1000;
    huTimerColors(remainingSec);
     document.getElementById("studentClock")?.style.setProperty("--clock-progress",String(Math.max(0,Math.min(100,remainingMs/totalMs*100)))+"%");

    document.getElementById("timerValue")
      .textContent =
      remainingSec.toFixed(1) + "초";

    const percent =
      Math.max(
        0,
        Math.min(
          100,
          (remainingMs / totalMs) * 100
        )
      );

    document.getElementById("timerBar")
      .style.width =
      percent + "%";


    if (remainingMs <= 0) {
      expireQuestion();
    }

  };


  update();

  timerInterval =
    setInterval(update, 100);

}

const HU_BACKGROUNDS=["images/nuclear_dome_01.png","images/human_action_01.png","images/nuclear_dome_02.png","images/human_action_02.png"];
function huBackground(q,index){const mode=q?.imageMode||"auto";if(mode==="none")return {mode,path:""};if(mode==="custom"&&q?.imagePath)return {mode,path:q.imagePath};return {mode:"auto",path:HU_BACKGROUNDS[index%HU_BACKGROUNDS.length]};}
const HU_MOBILE=true;

// Background selection is independent of the existing optional question picture.
const HU_SCENES={
 nuclear_dome_01:['images/nuclear_dome_01.png','images/nuclear_dome_01_mobile.png'],
 nuclear_dome_02:['images/nuclear_dome_02.png','images/nuclear_dome_02_mobile.png'],
 human_action_01:['images/human_action_01.png','images/human_action_01_mobile.png'],
 human_action_02:['images/human_action_02.png','images/human_action_02_mobile.png'],
 warmup_01:['images/warmup_01_host.png','images/warmup_01_mobile.png'],
 warmup_02:['images/warmup_02_host.png','images/warmup_02_mobile.png'],
 warmup_03:['images/warmup_03_host.png','images/warmup_03_mobile.png']
};
const huLoaded=new Map(),huResolved=new Map();
function huImageReady(path){
 if(!path)return Promise.resolve(false);
 if(!huLoaded.has(path))huLoaded.set(path,new Promise(resolve=>{
  const img=new Image();let done=false;
  const finish=ok=>{if(done)return;done=true;clearTimeout(timeout);resolve(ok);};
  const timeout=setTimeout(()=>finish(false),5000);
  img.onload=()=>{if(img.decode)img.decode().then(()=>finish(true),()=>finish(true));else finish(true);};
  img.onerror=()=>finish(false);img.src=path;
 }));
 return huLoaded.get(path);
}
function huScenePair(q,index){
 if(q.backgroundKey==='none')return ['',''];
 if(q.backgroundKey==='custom')return [q.backgroundHost||'',q.backgroundMobile||q.backgroundHost||''];
 if(HU_SCENES[q.backgroundKey])return HU_SCENES[q.backgroundKey];
 if(q.imageMode==='none'||q.imageMode==='custom')return ['',''];
 return Object.values(HU_SCENES)[index%4];
}
function huWarmupLayout(q){
 const paths=[q.backgroundKey,q.backgroundHost,q.backgroundMobile,q.imagePath].filter(Boolean).join(' ');
 if(/warmup_03(?:[_.\s]|$)/i.test(paths))return 'four';
 if(/warmup_0[12](?:[_.\s]|$)/i.test(paths))return 'pair';
 const options=(q.options||[]).map(x=>String(x).trim());
 if(Number(q.points)===0 && options.length===4 && ['사람','기린','개','닭'].every(x=>options.includes(x)))return 'four';
 return '';
}
function huSceneToken(q,index){return JSON.stringify([huScenePair(q,index),q.imageMode,q.imagePath]);}
async function huPreload(q,index){
 const pair=huScenePair(q,index),path=pair[HU_MOBILE?1:0];
 let ready=await huImageReady(path);let result=ready?path:'';
 if(!ready&&HU_MOBILE&&pair[0]!==path&&await huImageReady(pair[0]))result=pair[0];
 if(q.imageMode==='custom'&&q.imagePath)await huImageReady(q.imagePath);
 huResolved.set(huSceneToken(q,index),result);
}
function huApplyBackground(q,index,target,picture){
 const el=document.getElementById(target),img=document.getElementById(picture);
 const path=huResolved.get(huSceneToken(q,index))||'';
 el.style.setProperty('--hu-scene',path?'url('+JSON.stringify(path)+')':'linear-gradient(#e9f0f1,#e9f0f1)');
 const pic=q.imagePath && q.imageMode!=='none' ? q.imagePath : '';
 img.classList.toggle('is-visible',!!pic);if(pic){img.src=pic;img.onerror=()=>img.classList.remove('is-visible');}else img.removeAttribute('src');
}
let huPrepareInterval=null;
function huPreparation(until){
 document.getElementById('huPreparation').hidden=false;
 clearInterval(huPrepareInterval);
 const tick=()=>{const n=until?Math.ceil((until-serverNow())/1000):0;document.getElementById('huPrepareCount').textContent=n>0?n:'준비 중…';};
 tick();huPrepareInterval=setInterval(tick,100);
}
function huPreparationEnd(){clearInterval(huPrepareInterval);huPrepareInterval=null;document.getElementById('huPreparation').hidden=true;}
function huDelay(ms){return new Promise(resolve=>setTimeout(resolve,Math.max(0,ms)));}
function huPaintReady(){return Promise.race([new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve))),huDelay(150)]);}
function huPreloadAhead(list,index){for(let i=index+1;i<=Math.min(index+2,list.length-1);i++)void huPreload(list[i],i);}


function huTimerColors(remainingSec){const bar=document.getElementById("timerBar");bar.classList.toggle("hu-time-low",remainingSec<=5&&remainingSec>3);bar.classList.toggle("hu-time-critical",remainingSec<=3);const clock=document.getElementById("studentClock");if(clock){clock.classList.toggle("low",remainingSec<=5&&remainingSec>3);clock.classList.toggle("critical",remainingSec<=3);}}

function displayQuestion(questionIndex, state) {

  currentQuestion = questionIndex;

  submittedQuestion = -1;

  myAnswer = null;

  orderSelection = [];

  restoreAnswer(questionIndex);
  timeExpired = false;

  document.getElementById("timeOverMessage")
    .style.display = "none";


  const q =
    questions[currentQuestion];
  huApplyBackground(q,currentQuestion,"quizScreen","studentPicture");
   document.getElementById("quizScreen").classList.toggle("hu-warmup",Number(q.points)===0);
  // Recognize presets AND images selected through the custom image picker.
  const layout=huWarmupLayout(q);
  const warmupPair=layout==='pair';
  const warmupFour=layout==='four';
  document.getElementById("quizScreen").classList.toggle("hu-warmup-pair",warmupPair);
  document.getElementById("quizScreen").classList.toggle("hu-warmup-four",warmupFour);

  document.getElementById("questionNumber")
    .textContent =
    "문제 " +
    (currentQuestion + 1) +
    " / " +
    questions.length;


  document.getElementById("questionText")
    .textContent =
    q.text;


  const answers =
    document.getElementById("answers");


  answers.innerHTML = "";
  answers.style.setProperty('--answer-rows',String(Math.max(1,Math.ceil(q.options.length/2))));
  document.getElementById('quizScreen').classList.toggle('hu-selection-controls',q.type==='order'||q.type==='multi');
  answers.classList.toggle("long-answers",q.type!=="order"&&q.type!=="ox"&&q.options.some(opt=>String(opt).length>17));


  document.getElementById("orderInfo")
    .style.display = "none";

  document.getElementById("orderControls")
    .style.display = "none";


  const submittedWaitText = document.getElementById("submittedWaitText");
  if (submittedWaitText) submittedWaitText.textContent = q.type === "poll" ? "투표 결과를 기다려 주세요." : "강사의 정답 공개를 기다려 주세요.";

  q.options.forEach((option, index) => {

    const button =
      document.createElement("button");


    button.className =
      "answer color" +
      ((index % 4) + 1);


    button.textContent =
      q.type === "ox" ? option : (index + 1) + ". " + option;


    if (q.type === "order" || q.type === "multi") {

      button.onclick = function() {

        q.type === "multi" ? selectMulti(button,option) : selectOrder(button,option);

      };

    } else {

      button.onclick = function() {

        submitChoice(
          button,
          option
        );

      };

    }


    answers.appendChild(button);

  });


  if (q.type === "order" || q.type === "multi") {

    document.getElementById("orderInfo")
      .style.display = "block";

        document.getElementById("orderControls")
       .style.display = "block";
    document.querySelector("#orderControls .submit-button").style.display=q.type==="order"?"none":"inline-block";
    document.querySelector("#orderControls .reset-button").textContent=q.type==="order"?"마지막 선택 취소":"다시 선택";

    updateOrderDisplay();
    if(q.type === "multi")document.querySelector("#orderInfo .order-title").textContent="내가 선택한 보기";else document.querySelector("#orderInfo .order-title").textContent="내가 선택한 순서";
  }


  showScreen("quizScreen");
  requestAnimationFrame(()=>{
    const screen=document.getElementById('quizScreen');
    const title=document.getElementById('questionText');
    screen.style.setProperty('--photo-top',(title.offsetTop+title.offsetHeight+10)+'px');
  });


  const durationSec =
    state && state.durationSec
      ? Number(state.durationSec)
      : 10;

  const startedAt =
    state && state.startedAt
      ? Number(state.startedAt)
      : serverNow();

  if (submittedQuestion === currentQuestion) {
    stopTimer();
    showScreen("submittedScreen");
  } else {
    startTimer(startedAt, durationSec);
  }

}



/* ------------------------
   일반/OX 선택
------------------------- */

async function submitChoice(
  button,
  answer
) {

  if (
    submittedQuestion ===
    currentQuestion ||
    timeExpired
  ) return;


  document.querySelectorAll(".answer")
    .forEach(btn => {

      btn.disabled = true;

    });


  button.classList.add("selected");


  myAnswer = answer;


  await saveAnswer(answer);

}



/* ------------------------
   순서 선택
------------------------- */

function selectMulti(button,option){
 if(submittedQuestion===currentQuestion||timeExpired)return;
 if(orderSelection.includes(option)){orderSelection=orderSelection.filter(v=>v!==option);button.classList.remove("used");}
 else{orderSelection.push(option);button.classList.add("used");}
 updateOrderDisplay();
}
function selectOrder(
  button,
  option
) {

  if (
    submittedQuestion ===
    currentQuestion ||
    timeExpired || answerSaving
  ) return;


  if (
    orderSelection.includes(option)
  ) return;


  orderSelection.push(option);


  button.classList.add("used");

  button.disabled = true;


  button.textContent = (orderSelection.length) + "번째 ✓ " + option;
  updateOrderDisplay();
  if(orderSelection.length === questions[currentQuestion].options.length){
    submitOrder();
  }
}



function updateOrderDisplay() {

  const display =
    document.getElementById("orderDisplay");


  if (orderSelection.length === 0) {

    display.textContent =
      "아직 선택하지 않았습니다.";

  } else {

    display.textContent =
      orderSelection.map(v => (questions[currentQuestion]?.options.indexOf(v) ?? -1) + 1).join(" → ");

  }

}



window.resetOrder = function() {

  if (
    submittedQuestion ===
    currentQuestion ||
    timeExpired
  ) return;


  if(questions[currentQuestion]?.type === "order"){
    const removed=orderSelection.pop();
    if(removed===undefined)return;
    const idx=questions[currentQuestion].options.indexOf(removed);
    const btn=document.querySelectorAll(".answer")[idx];
    if(btn){btn.disabled=false;btn.classList.remove("used");btn.textContent=(idx+1)+". "+removed;}
  }else{
    orderSelection=[];
    document.querySelectorAll(".answer").forEach((btn,i)=>{btn.disabled=false;btn.classList.remove("used");});
  }
  updateOrderDisplay();

};



window.submitOrder = async function() {

  if (timeExpired || answerSaving || submittedQuestion === currentQuestion) {
    return;
  }

  const q =
    questions[currentQuestion];


  if (
    (q.type === "multi" ? orderSelection.length === 0 : orderSelection.length !== q.options.length)
  ) {

    alert(
      "모든 항목을 순서대로 선택해주세요."
    );

    return;

  }


  myAnswer =
    q.type === "multi" ? [...orderSelection].sort() : [...orderSelection];


  document.querySelectorAll(".answer")
    .forEach(btn => {

      btn.disabled = true;

    });


  await saveAnswer(myAnswer);

};



/* ------------------------
   Firebase 답변 저장
------------------------- */

async function saveAnswer(answer) {

  if (timeExpired || answerSaving || submittedQuestion === currentQuestion) {
    return;
  }

  answerSaving = true;
  const savingQuestion = currentQuestion;
  const savingParticipantId=participantId;

  // 문제 번호 + 참가자 ID를 고정 키로 사용해 중복 답변을 구분합니다.
  // 서버 보안규칙에서 기존 키의 덮어쓰기를 금지해야 최종적으로 보호됩니다.
  const answerRef = ref(database, "answers/" + currentQuestion + "_" + participantId);

  try {

    await set(
      answerRef,
      {

        participantId:
          participantId,
        ownerUid: auth.currentUser?.uid || "",

        nickname:
          nickname,

        question:
          currentQuestion,

        answer:
          answer,

        submittedAt:
          serverTimestamp()

      }
    );


    if(!joined||participantId!==savingParticipantId||latestQuizState?.status==='finished')return;
    rememberAnswer(savingQuestion, answer);
    submittedQuestion = savingQuestion;
    stopTimer();


    if(currentQuestion===savingQuestion&&latestQuizState?.status==="question")showScreen("submittedScreen");


  } catch(error) {

    alert(
      "답변 전송에 실패했습니다."
    );

    console.error(error);
    if (!timeExpired && currentQuestion === savingQuestion) {
      document.querySelectorAll(".answer").forEach(btn => { btn.disabled = false; });
      const submitButton = document.querySelector(".submit-button");
      if (submitButton) submitButton.disabled = false;
    }
  } finally {
    answerSaving = false;
  }

}



/* ------------------------
   정답 결과 표시
------------------------- */

function showResult() {

  stopTimer();

  const q =
    questions[currentQuestion];


  if (
    submittedQuestion !==
    currentQuestion
  ) {

    /*
      답을 제출하지 않은 경우도
      정답 공개 화면은 볼 수 있다.
    */

    myAnswer = null;

  }


  let isCorrect = false;


  if (myAnswer !== null) {

    if (q.type === "poll") { isCorrect = true; } else if (q.type === "multi") { isCorrect = JSON.stringify([...(myAnswer||[])].sort()) === JSON.stringify([...q.correct].sort()); } else if (q.type === "order") {

      isCorrect =
        JSON.stringify(myAnswer) ===
        JSON.stringify(q.correct);

    } else {

      isCorrect =
        myAnswer === q.correct;

    }

  }


  document.getElementById("resultSymbol")
    .textContent =
    q.type === "poll" ? "🗳️" : (isCorrect ? "⭕" : "❌");


  document.getElementById("resultTitle")
    .textContent =
    q.type === "poll" ? "투표 결과 공개!" : (isCorrect ? "정답입니다!" : "아쉽네요!");


  let myText =
    "미제출";


  if (myAnswer !== null) {

    myText =
      Array.isArray(myAnswer) ?
      myAnswer.join(" → ") :
      myAnswer;

  }


  let correctText =
    Array.isArray(q.correct) ?
    q.correct.join(" → ") :
    q.correct;


  document.getElementById("myAnswer")
    .textContent =
    "내 답 : " +
    myText;


  document.getElementById("correctAnswer")
    .textContent =
    q.type === "poll" ? "" : "정답 : " + correctText;


  document.getElementById("explanation")
    .textContent =
    "";


  let choices=document.getElementById('resultChoices');
  if(!choices){choices=document.createElement('div');choices.id='resultChoices';document.getElementById('correctAnswer').after(choices);}
  choices.replaceChildren();
  if(q.type!=='poll')q.options.forEach((option,index)=>{
    const cell=document.createElement('div');cell.className='result-choice';
    const correct=Array.isArray(q.correct)?q.correct.includes(option):q.correct===option;
    cell.textContent=(q.type==='order'?(q.correct.indexOf(option)+1)+'번째 · ':q.type==='ox'?'':(index+1)+'. ')+option+(correct?' ✓':'');
    if(correct)cell.classList.add('correct-choice');choices.append(cell);
  });
  choices.hidden=q.type==='poll';
  // Use the background belonging to THIS question, even on direct result-state entry.
  const resolvedPath=huResolved.get(huSceneToken(q,currentQuestion));
  const resultScene=resolvedPath?'url('+JSON.stringify(resolvedPath)+')':'linear-gradient(#e9f0f1,#e9f0f1)';
  document.getElementById('resultScreen').style.setProperty('--hu-result-scene',resultScene);
  showScreen("resultScreen");

}



/* ------------------------
   강사 진행상태 감시 및 재접속 복구
------------------------- */


function leaveCompletedQuiz(){
 stopTimer();huPreparationEnd();
 let saved=null;try{saved=JSON.parse(sessionStorage.getItem(participantStorageKey)||'null');}catch{}
 const oldId=participantId||saved?.participantId;
 sessionStorage.removeItem(participantStorageKey);
 if(oldId){const prefix='huQuizAnswer_'+oldId+'_';for(let i=sessionStorage.length-1;i>=0;i--){const key=sessionStorage.key(i);if(key?.startsWith(prefix))sessionStorage.removeItem(key);}}
 joined=false;participantId='';nickname='';currentQuestion=-1;submittedQuestion=-1;myAnswer=null;orderSelection=[];timeExpired=false;
 document.getElementById('nickname').value='';
 document.getElementById('joinNotice').textContent='퀴즈가 종료되었습니다. 참여해 주셔서 감사합니다! 다음 퀴즈가 준비되면 다시 입장해 주세요.';
 document.querySelector('#joinScreen .main-button').disabled=true;
 showScreen('joinScreen');
}

let huStudentVersion=0;
async function applyQuizState(state) {
  const version=++huStudentVersion;
  huPreparationEnd();
  if (state && Array.isArray(state.questions) && state.questions.length) questions = state.questions;
  if(state?.status==='finished'){leaveCompletedQuiz();return;}
  if(!state||state.status==='waiting'){
    document.getElementById('joinNotice').textContent='';
    document.querySelector('#joinScreen .main-button').disabled=false;
  }
  if (!joined) return;
  if (!state) {
    stopTimer();
    showScreen("waitingScreen");
    return;
  }

  if (state.status === "question") {
    const newQuestion = Number(state.question);
    if (!Number.isInteger(newQuestion) || newQuestion < 0 || newQuestion >= questions.length) return;
    if (newQuestion !== currentQuestion) {
      stopTimer();huPreparation(Number(state.startedAt));
      const backgroundReady=huPreload(questions[newQuestion],newQuestion);
      huPreloadAhead(questions,newQuestion);
      await backgroundReady;
      if(version!==huStudentVersion)return;
      huApplyBackground(questions[newQuestion],newQuestion,"quizScreen","studentPicture");
      await Promise.all([huPaintReady(),huDelay(Number(state.startedAt)-serverNow())]);
      if(version!==huStudentVersion)return;
      displayQuestion(newQuestion, state);huPreparationEnd();
      huPreloadAhead(questions,newQuestion);
    } else if (submittedQuestion === currentQuestion) {
      stopTimer();
      showScreen("submittedScreen");
    } else if (!timerInterval && !timeExpired) {
      startTimer(state.startedAt, state.durationSec || 10);
    }
    return;
  }

  if (state.status === "result") {
    const newQuestion = Number(state.question);
    if (!Number.isInteger(newQuestion) || newQuestion < 0 || newQuestion >= questions.length) return;
    if (currentQuestion !== newQuestion) {
      currentQuestion = newQuestion;
      submittedQuestion = -1;
      myAnswer = null;
      restoreAnswer(newQuestion);
    }
    await huPreload(questions[newQuestion],newQuestion);
    if(version!==huStudentVersion)return;
    showResult();
    return;
  }

  if (state.status === "waiting") {
    // 강사가 새 퀴즈를 준비했다면 기존 참가자 세션을 폐기하고 재입장 유도
    if (state.resetAt && String(state.resetAt) !== sessionStorage.getItem(resetStorageKey)) {
      sessionStorage.setItem(resetStorageKey, String(state.resetAt));
      sessionStorage.removeItem(participantStorageKey);
      if (participantId) {
        for (let i = 0; i < questions.length; i++) {
          sessionStorage.removeItem("huQuizAnswer_" + participantId + "_" + i);
        }
      }
      joined = false;
      participantId = "";
      nickname = "";
      currentQuestion = -1;
      submittedQuestion = -1;
      myAnswer = null;
      stopTimer();
      showScreen("joinScreen");
      return;
    }
    stopTimer();
    currentQuestion = -1;
    submittedQuestion = -1;
    myAnswer = null;
    showScreen("waitingScreen");
    return;
  }

  if (state.status === "finished") {
    stopTimer();
    showScreen("finishedScreen");
  }
}

onValue(ref(database, "quizState"), snapshot => {
  latestQuizState = snapshot.val();
  applyQuizState(latestQuizState);
}, error => console.error("진행상태 수신 실패:", error));

restoreParticipant();
