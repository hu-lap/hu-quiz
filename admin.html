<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문제 관리</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#1b2433;--sub:#5d6b82;--line:#d9dee6;--accent:#2f5bea;--danger:#c8372d;--ok:#1e8a5a}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
h1{font-size:1.25rem;margin:0}
label{display:block;font-size:.875rem;color:var(--sub);margin-bottom:12px}
input,textarea,select{display:block;width:100%;margin-top:4px;padding:10px 12px;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{resize:vertical;min-height:64px}
button{font:inherit;cursor:pointer;border-radius:6px;padding:10px 16px;border:1px solid var(--line);background:#fff;color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.danger{color:var(--danger);border-color:var(--danger)}
button.ghost{border-color:transparent;background:transparent;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login .card{width:100%;max-width:360px}
.login h1{margin-bottom:20px}
.login button{width:100%;margin-top:4px}
.err{color:var(--danger);font-size:.875rem;min-height:1.4em;margin:12px 0 0}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.wrap{display:grid;grid-template-columns:280px 1fr;gap:20px;max-width:1100px;margin:20px auto;padding:0 16px;align-items:start}
aside button.primary{width:100%;margin-bottom:12px}
.item{display:block;width:100%;text-align:left;margin-bottom:8px;padding:12px 14px;border-radius:8px}
.item small{display:block;color:var(--sub)}
.item.active{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.empty{color:var(--sub);padding:12px 4px}
.q{border:1px solid var(--line);border-radius:8px;margin:10px 0;background:#fafbfc;overflow:hidden}
.qb{padding:4px 16px 16px;border-top:1px solid var(--line)}
.qh{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.qh:hover{background:#eef1f6}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;background:#e6ecff;color:var(--accent);flex:none}
.qt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--sub);font-size:.8125rem;flex:none}
.acts{display:flex;flex:none}
.acts button{padding:4px 8px}
@media(max-width:560px){.meta{display:none}.acts button{padding:4px 6px}}
.opt{display:flex;align-items:center;gap:10px;margin-top:8px}
.opt input[type=radio],.opt input[type=checkbox]{width:20px;height:20px;margin:0;flex:none}
.opt input[type=text]{margin:0}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.nums label{margin:0}
.hint{color:var(--sub);font-size:.8125rem;margin:8px 0 0}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.bar .grow{flex:1}
#msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:.9375rem;max-width:90vw}
#msg.bad{background:var(--danger)}
aside>button{width:100%;margin-bottom:12px}
.no{width:20px;text-align:center;color:var(--sub);flex:none}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<main id="login" class="login">
  <form id="lf" class="card">
    <h1>문제 관리</h1>
    <label>비밀번호<input id="pw" type="password" autocomplete="current-password" required autofocus></label>
    <button class="primary">로그인</button>
    <p id="lerr" class="err" role="alert"></p>
  </form>
</main>

<div id="app" hidden>
  <header><h1>문제 관리</h1><button class="ghost" data-act="logout">로그아웃</button></header>
  <div class="wrap">
    <aside>
      <button class="primary" data-act="new">새 문제 세트</button>
      <button data-act="import">JSON 파일 가져오기</button>
      <input id="imp" type="file" accept=".json,application/json" hidden>
      <div id="list"></div>
    </aside>
    <section id="editor" class="card"></section>
  </div>
</div>

<p id="msg" role="status" hidden></p>

<script type="module">
import { auth, db, ADMIN_EMAIL } from "./firebase-config.js";
import { signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { ref, onValue, push, set, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let sets = {}, cur = null, unsub = null, timer;



function toast(text, bad) {
  const m = $("#msg");
  m.textContent = text; m.className = bad ? "bad" : ""; m.hidden = false;
  clearTimeout(timer); timer = setTimeout(() => m.hidden = true, 4000);
}

/* ---------- 로그인 ---------- */
$("#lf").addEventListener("submit", async e => {
  e.preventDefault();
  $("#lerr").textContent = "";
  try {
    await signInWithEmailAndPassword(auth, ADMIN_EMAIL, $("#pw").value);
  } catch (err) {
    $("#lerr").textContent = ["auth/invalid-credential", "auth/wrong-password", "auth/user-not-found", "auth/invalid-email"].includes(err.code)
      ? `비밀번호가 맞지 않아요. (${err.code} / ${ADMIN_EMAIL})`
      : err.code === "auth/too-many-requests"
        ? "시도가 너무 많아요. 잠시 후 다시 해주세요."
        : "로그인하지 못했어요. (" + err.code + ")";
  }
});

onAuthStateChanged(auth, user => {
  $("#login").hidden = !!user;
  $("#app").hidden = !user;
  if (user) {
    unsub = onValue(ref(db, "quizSets"), snap => { sets = snap.val() || {}; renderList(); },
      () => toast("문제 세트를 불러오지 못했어요. 관리자 계정인지 확인하세요.", true));
    renderEditor();
  } else {
    if (unsub) unsub();
    unsub = null; sets = {}; cur = null;
    $("#pw").value = "";
  }
});

/* ---------- 목록 ---------- */
function renderList() {
  const ids = Object.keys(sets).sort((a, b) => (sets[b].updatedAt || 0) - (sets[a].updatedAt || 0));
  $("#list").innerHTML = ids.length
    ? ids.map(id => {
        const n = Object.keys(sets[id].questions || {}).length;
        return `<button class="item ${cur && cur.id === id ? "active" : ""}" data-act="open" data-id="${id}">${esc(sets[id].title)}<small>문제 ${n}개</small></button>`;
      }).join("")
    : `<p class="empty">아직 문제 세트가 없어요. 새 문제 세트를 만들어 보세요.</p>`;
}

const SHORT = { choice: "객관식", ox: "OX", multi: "복수선택", order: "순서", poll: "투표" };
const NSLOT = { choice: 4, ox: 2, multi: 6, order: 6, poll: 6 };
const TYPES = { choice: "객관식 (2~4지선다)", ox: "OX", multi: "복수 선택", order: "순서 누르기", poll: "투표 (정답 없음)" };
const pad = q => { const n = NSLOT[q.type]; q.opts = q.opts.slice(0, n); while (q.opts.length < n) q.opts.push(""); if (q.type === "ox") q.opts = ["O", "X"]; return q; };
const mk = (type = "choice") => pad({ open: true, type, text: "", opts: [], ai: 0, ais: [], exp: "", time: 20, pts: type === "poll" ? 0 : 1000 });
const fromDb = q => {
  const t = TYPES[q.type] ? q.type : "choice", o = [...(q.options || [])];
  const m = { open: false, type: t, text: q.text || "", opts: t === "order" ? [...(q.correct || o)] : o, ai: 0, ais: [], exp: q.explanation || "", time: q.durationSec || 20, pts: q.points ?? 1000 };
  if (t === "choice" || t === "ox") m.ai = Math.max(0, o.indexOf(q.correct));
  if (t === "multi") m.ais = (q.correct || []).map(c => o.indexOf(c)).filter(i => i >= 0);
  if (t === "poll") m.pts = 0;
  return pad(m);
};

function openSet(id) {
  cur = id
    ? { id, title: sets[id].title || "", description: sets[id].description || "", questions: Object.values(sets[id].questions || {}).map(fromDb) }
    : { id: null, title: "", description: "", questions: [mk()] };
  renderList(); renderEditor();
}

/* ---------- 편집 ---------- */
function optHtml(q, i) {
  const T = q.type;
  if (T === "order") return q.opts.map((o, k) => `<div class="opt"><span class="no">${k + 1}</span><input type="text" data-f="o" data-k="${k}" value="${esc(o)}" maxlength="80" placeholder="${k + 1}번째로 누를 보기"></div>`).join("")
    + `<p class="hint">정답 순서대로 입력하세요. 참가자 화면에는 섞여서 나와요. 2개 이상 입력하면 돼요.</p>`;
  return q.opts.map((o, k) => {
    const pick = T === "multi" ? `<input type="checkbox" data-f="m" data-k="${k}" ${q.ais.includes(k) ? "checked" : ""} aria-label="보기 ${k + 1} 정답">`
      : T === "poll" ? "" : `<input type="radio" name="a${i}" data-f="a" value="${k}" ${q.ai === k ? "checked" : ""} aria-label="보기 ${k + 1} 정답">`;
    return `<div class="opt">${pick}<input type="text" data-f="o" data-k="${k}" value="${esc(o)}" maxlength="80" placeholder="보기 ${k + 1}" ${T === "ox" ? "readonly" : ""}></div>`;
  }).join("") + `<p class="hint">${T === "multi" ? "정답인 보기를 모두 체크하세요. 참가자에게 정답 개수가 안내돼요." : T === "poll" ? "정답 없이 선택 결과만 보여줘요." : T === "ox" ? "정답을 선택하세요." : "정답인 보기를 선택하세요. 보기는 2개 이상 입력하면 돼요."}</p>`;
}

function renderEditor() {
  const ed = $("#editor");
  if (!cur) { ed.innerHTML = `<p class="empty">왼쪽에서 문제 세트를 고르거나 새로 만드세요.</p>`; return; }
  ed.innerHTML = `
    <label>세트 제목<input data-f="title" value="${esc(cur.title)}" maxlength="60" placeholder="예: 항공기 객실 안전 1과정"></label>
    <label>설명 (선택)<textarea data-f="desc" maxlength="200">${esc(cur.description)}</textarea></label>
    <div class="bar"><span class="grow">문제 ${cur.questions.length}개</span><button data-act="expand">모두 펼치기</button><button data-act="collapse">모두 접기</button></div>
    ${cur.questions.map((q, i) => `
      <div class="q" data-i="${i}">
        <div class="qh" data-act="tog" data-i="${i}">
          <span class="no">${i + 1}</span><span class="tag">${SHORT[q.type]}</span>
          <span class="qt">${esc(q.text.trim().slice(0, 50) || "(문제 내용 없음)")}</span>
          <span class="meta">${q.time}초 · ${q.type === "poll" ? "투표" : q.pts ? q.pts + "점" : "몸풀기"}</span>
          <span class="acts">
            <button class="ghost" data-act="up" data-i="${i}" ${i === 0 ? "disabled" : ""} aria-label="위로">↑</button>
            <button class="ghost" data-act="down" data-i="${i}" ${i === cur.questions.length - 1 ? "disabled" : ""} aria-label="아래로">↓</button>
            <button class="ghost" data-act="dup" data-i="${i}">복제</button>
            <button class="ghost" data-act="rm" data-i="${i}" ${cur.questions.length < 2 ? "disabled" : ""}>삭제</button>
          </span>
        </div>
        ${q.open ? `<div class="qb">
          <label>유형<select data-f="type">${Object.entries(TYPES).map(([k, v]) => `<option value="${k}" ${q.type === k ? "selected" : ""}>${v}</option>`).join("")}</select></label>
          <label>문제 내용<textarea data-f="text">${esc(q.text)}</textarea></label>
          ${optHtml(q, i)}
          <label>해설 (정오 화면에 표시, 선택)<textarea data-f="exp" maxlength="200">${esc(q.exp)}</textarea></label>
          <div class="nums">
            <label>제한 시간 (5~120초)<input type="number" data-f="time" min="5" max="120" value="${q.time}"></label>
            ${q.type === "poll" ? "" : `<label>배점 (0이면 점수 없는 문제)<input type="number" data-f="pts" min="0" step="100" value="${q.pts}"></label>`}
          </div>
        </div>` : ""}
      </div>`).join("")}
    <div class="bar">
      <button data-act="add">문제 추가</button>
      <span class="grow"></span>
      ${cur.id ? `<button class="danger" data-act="del">세트 삭제</button>` : ""}
      <button class="primary" data-act="save">저장</button>
    </div>`;
}

$("#editor").addEventListener("input", e => {
  const t = e.target, f = t.dataset.f;
  if (!cur || !f) return;
  const q = cur.questions[t.closest(".q")?.dataset.i];
  if (f === "title") cur.title = t.value;
  else if (f === "desc") cur.description = t.value;
  else if (f === "type") { q.type = t.value; q.ai = 0; q.ais = []; if (t.value === "poll") q.pts = 0; else if (!q.pts) q.pts = 1000; pad(q); renderEditor(); }
  else if (f === "text") q.text = t.value;
  else if (f === "o") q.opts[+t.dataset.k] = t.value;
  else if (f === "a") q.ai = +t.value;
  else if (f === "m") { const k = +t.dataset.k; q.ais = t.checked ? [...new Set([...q.ais, k])] : q.ais.filter(x => x !== k); }
  else if (f === "exp") q.exp = t.value;
  else if (f === "time") q.time = +t.value;
  else if (f === "pts") q.pts = +t.value;
});

$("#imp").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file) return;
  try {
    const a = JSON.parse(await file.text());
    if (!Array.isArray(a) || !a.length) throw 0;
    cur = { id: null, title: file.name.replace(/\.json$/i, ""), description: "", questions: a.map(fromDb) };
    renderList(); renderEditor(); toast("불러왔어요. 내용을 확인하고 저장하세요.");
  } catch { toast("JSON 파일 형식이 맞지 않아요.", true); }
});

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  if (act === "logout") signOut(auth);
  else if (act === "new") openSet(null);
  else if (act === "import") $("#imp").click();
  else if (act === "open") openSet(b.dataset.id);
  else if (act === "add") { cur.questions.push(mk()); renderEditor(); focusQ(cur.questions.length - 1); }
  else if (act === "tog") { const q = cur.questions[+b.dataset.i]; q.open = !q.open; renderEditor(); }
  else if (act === "expand" || act === "collapse") { cur.questions.forEach(q => q.open = act === "expand"); renderEditor(); }
  else if (act === "up" || act === "down") { const i = +b.dataset.i, j = act === "up" ? i - 1 : i + 1, a = cur.questions; [a[i], a[j]] = [a[j], a[i]]; renderEditor(); focusQ(j); }
  else if (act === "dup") { const i = +b.dataset.i, c = structuredClone(cur.questions[i]); c.open = true; cur.questions.splice(i + 1, 0, c); renderEditor(); focusQ(i + 1); }
  else if (act === "rm") { if (!confirm("이 문제를 삭제할까요?")) return; cur.questions.splice(+b.dataset.i, 1); renderEditor(); }
  else if (act === "save") save();
  else if (act === "del") {
    if (!confirm(`"${cur.title}" 세트를 삭제할까요? 되돌릴 수 없어요.`)) return;
    try { await remove(ref(db, "quizSets/" + cur.id)); cur = null; renderEditor(); toast("삭제했어요."); }
    catch { toast("삭제하지 못했어요.", true); }
  }
});

const focusQ = i => document.querySelectorAll(".q")[i]?.scrollIntoView({ block: "nearest", behavior: "smooth" });
const shuf = a => { const b = [...a]; for (let n = 0; n < 9 && b.join() === a.join(); n++) b.sort(() => Math.random() - .5); return b; };

function toDb(q, i) {
  const e = m => { throw new Error(`문제 ${i + 1}: ${m}`); };
  const t = q.type, O = q.opts.map(x => x.trim()), L = O.filter(Boolean);
  if (!q.text.trim()) e("문제 내용을 입력하세요.");
  if (L.length < 2) e("보기를 2개 이상 입력하세요.");
  if (new Set(L).size !== L.length) e("같은 보기가 2개 있어요.");
  const r = { type: t, text: q.text.trim(), options: L, explanation: q.exp.trim(),
    durationSec: Math.min(120, Math.max(5, q.time || 20)), points: t === "poll" ? 0 : Math.max(0, q.pts || 0) };
  if (t === "choice" || t === "ox") { if (!O[q.ai]) e("정답을 선택하세요."); r.correct = O[q.ai]; }
  else if (t === "multi") { const c = q.ais.filter(k => O[k]).map(k => O[k]); if (!c.length) e("정답을 1개 이상 체크하세요."); r.correct = c; }
  else if (t === "order") { r.correct = L; r.options = shuf(L); }
  return r;
}

async function save() {
  const title = cur.title.trim();
  if (!title) return toast("세트 제목을 입력하세요.", true);
  let qs;
  try { qs = cur.questions.map(toDb); } catch (err) { return toast(err.message, true); }
  const id = cur.id || push(ref(db, "quizSets")).key;
  try {
    await set(ref(db, "quizSets/" + id), { title, description: cur.description.trim(), questions: qs, updatedAt: serverTimestamp() });
    cur.id = id; renderEditor(); toast("저장했어요.");
  } catch { toast("저장하지 못했어요. 로그인 상태를 확인하세요.", true); }
}
</script>
</body>
</html>
